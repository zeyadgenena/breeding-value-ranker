<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breeding Value Ranker</title>
<meta name="description" content="Tell us what you have and what you can spend. We match you with the halter stallion whose foals have the strongest record within your budget.">
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --line:rgba(11,11,11,.12); --wash:rgba(11,11,11,.04); --accent:#2a78d6; --good:#0ca30c;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --line:rgba(255,255,255,.14); --wash:rgba(255,255,255,.06); --accent:#3987e5;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:680px;margin:0 auto;padding:28px 16px 56px}
h1{font-size:30px;line-height:1.15;margin:0 0 6px}
.tag{color:var(--ink2);margin:0 0 30px;font-size:18px}
h2{font-size:20px;margin:30px 0 12px}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.choices{grid-template-columns:minmax(0,1fr)}}
.choice{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;cursor:pointer}
.choice b{display:block;font-size:18px}
.choice span{color:var(--ink2);font-size:14.5px}
.choice:hover{background:var(--wash)}
.choice[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.money{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 16px;max-width:260px}
.money:focus-within{border-color:var(--ink)}
.money span{font-size:26px;color:var(--muted)}
.money input{border:0;outline:0;background:none;font-size:26px;font-weight:600;width:100%;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:15px}
.chip:hover{background:var(--wash)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.field{margin:18px 0 0}
.field label{display:block;font-weight:600;margin:0 0 6px}
.field small{display:block;color:var(--ink2);margin:6px 0 0;font-size:14.5px}
.field input[type=text],.field select{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;width:100%;max-width:360px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:18px 20px;margin:0 0 12px}
.card.best{border:2px solid var(--ink)}
.eyebrow{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);font-weight:600;margin:0 0 4px}
.name{font-size:24px;font-weight:700;line-height:1.2;margin:0}
.card:not(.best) .name{font-size:19px}
.by{color:var(--ink2);font-size:14.5px;margin:2px 0 10px}
.row{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;margin:0 0 8px}
.price{font-size:26px;font-weight:700}
.card:not(.best) .price{font-size:20px}
.price small{font-size:14.5px;font-weight:400;color:var(--ink2);margin-left:6px}
.badge{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:15px;white-space:nowrap}
.badge i{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid var(--muted)}
.badge.strong i{background:var(--good);border-color:var(--good)}
.badge.some i{background:var(--muted)}
.why{margin:0;color:var(--ink)}
.fine{color:var(--ink2);font-size:14.5px;margin:6px 0 0}
.note{border-left:4px solid var(--accent);background:var(--surface);border-radius:8px;padding:12px 14px;margin:14px 0;color:var(--ink2)}
.note b{color:var(--ink)}
.linkbtn{border:0;background:none;padding:0;text-decoration:underline;cursor:pointer;color:inherit}
details{margin:14px 0 0}
summary{cursor:pointer;font-weight:600}
.list{list-style:none;margin:10px 0 0;padding:0}
.list li{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.list li b{font-weight:600}
.list .r{display:flex;gap:14px;align-items:baseline;color:var(--ink2);font-size:15px}
.plan{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr);gap:6px 14px;align-items:baseline;padding:14px 0;border-top:1px solid var(--line)}
.plan:first-of-type{border-top:0}
.plan .k{color:var(--ink2);font-size:13.5px;display:block}
.plan .v{font-size:20px;font-weight:700}
@media (max-width:560px){.plan{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.plan > div:first-child{grid-column:1 / -1}}
footer{margin:40px 0 0;padding:18px 0 0;border-top:1px solid var(--line);color:var(--ink2);font-size:15px}
footer ul{margin:10px 0 0;padding-left:20px}
footer li{margin:6px 0}
ul.plain{margin:6px 0 0;padding-left:20px}
ul.plain li{margin:8px 0}
</style>
</head>

<script>
(function(){
'use strict';
var D = window.BVR, M = D.match, S = M.stallions, app = document.getElementById('app');
var Y = M.years, SPAN = Y.length ? Y[0] + ' to ' + Y[Y.length - 1] : '';

function h(tag, attrs){
  var el = document.createElement(tag), k, i;
  attrs = attrs || {};
  for (k in attrs){
    if (attrs[k] == null || attrs[k] === false) continue;
    if (k === 'text') el.textContent = attrs[k];
    else if (k === 'class') el.className = attrs[k];
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), attrs[k]);
    else el.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
  }
  for (i = 2; i < arguments.length; i++) add(el, arguments[i]);
  return el;
}
function add(el, kid){
  if (kid == null || kid === false) return;
  if (Array.isArray(kid)) { kid.forEach(function(k){ add(el, k); }); return; }
  el.appendChild(typeof kid === 'string' || typeof kid === 'number' ? document.createTextNode(String(kid)) : kid);
}
function money(v){ return '$' + Math.round(v).toLocaleString('en-US'); }
function round(v){
  if (v >= 1e6) return '$' + (v / 1e6).toFixed(1) + ' million';
  if (v >= 10000) return '$' + (Math.round(v / 1000) * 1000).toLocaleString('en-US');
  return money(v);
}
function norm(s){ return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
function tierRank(t){ return t === 'strong' ? 2 : t === 'some' ? 1 : 0; }
function best(list){
  return list.slice().sort(function(a, b){
    return b.score - a.score || tierRank(b.rec.tier) - tierRank(a.rec.tier) || a.price.fee - b.price.fee || (a.name < b.name ? -1 : 1);
  });
}
var PRICED = S.filter(function(s){ return s.price; });
var PROVEN = PRICED.filter(function(s){ return s.rec.tier !== 'none'; });
var LOWEST = PRICED.reduce(function(m, s){ return Math.min(m, s.price.fee); }, Infinity);
var LOWEST_PROVEN = best(PROVEN).sort(function(a, b){ return a.price.fee - b.price.fee; })[0];
var MARES = M.sales && M.sales.mares;

var state = {have: null, budget: null, sire: '', total: null, mine: ''};

/* ---------- pieces ---------- */
function badge(st){
  var t = st.rec.tier;
  return h('span', {class: 'badge ' + t}, h('i'), t === 'strong' ? 'Strong record' : t === 'some' ? 'Some record' : 'No foal results yet');
}
function priceLine(st){
  if (!st.price) return h('span', {class: 'price'}, 'Price on request');
  return h('span', {class: 'price'}, money(st.price.fee),
    h('small', {text: st.price.current ? 'stud fee, ' + st.price.year : 'last advertised fee, ' + st.price.year}));
}
function why(st){
  var r = st.rec;
  if (r.tier === 'none' || !r.y) return 'None of his foals are on the halter leaderboards for ' + SPAN + '.';
  if (r.y < M.latest) return 'His foals were last on the leaderboard in ' + r.y + ', when they won ' + round(r.e) + '.';
  var s = 'His foals won ' + round(r.e) + ' in halter classes in ' + r.y + ', and ' + r.n + ' of them earned money.';
  if (r.prev > 0 && r.e / r.prev >= 1.2) s += ' That is up from ' + round(r.prev) + ' the year before.';
  else if (r.prev > 0 && r.e / r.prev <= 0.8) s += ' That is down from ' + round(r.prev) + ' the year before.';
  else if (r.prev === 0) s += ' The year before he was not on the list.';
  return s;
}
function expectBox(budget){
  var items = [], R = M.record, Y = M.sales && M.sales.young;
  if (R){
    var rows = R.by_budget, row = rows[0], at2k = null;
    rows.forEach(function(x){ if (x.budget === 2000) at2k = x; if (x.budget === null ? budget >= 2500 : budget >= x.budget) row = x; });
    var label = row.budget === null ? 'with no budget limit' : 'at a ' + money(row.budget) + ' budget';
    var t = 'We re-ran this for the ' + R.first_season + ' to ' + R.last_season + ' breeding seasons, using only what was known at the time. ' +
      row.hit + ' of the ' + row.picks + ' top picks ' + label + ' went on to sire a foal that finished in the top 50 halter money earners. ' +
      'For the average stallion at that price it was ' + Math.round(row.base * 100) + '%.';
    if (row.budget !== null && row.budget < 2000 && at2k) t += ' At ' + money(2000) + ' it was ' + at2k.hit + ' of ' + at2k.picks + '.';
    items.push(h('li', {text: t}));
  }
  if (Y) items.push(h('li', {text: 'Do not count on a quick resale. In ' + Y.n + ' public online sales of young horses by these stallions, the typical price was ' +
    Y.median_multiple.toFixed(1) + ' times the stud fee, and ' + (Y.at_least_20000 ? Y.at_least_20000 : 'none') + ' reached $20,000. The big results come as prize money and private sales.'}));
  return items.length ? h('div', {class: 'card'}, h('p', {class: 'eyebrow', text: 'What to expect'}), h('ul', {class: 'plain'}, items)) : null;
}
function card(st, label, isBest){
  return h('article', {class: 'card' + (isBest ? ' best' : '')},
    label ? h('p', {class: 'eyebrow', text: label}) : null,
    h('p', {class: 'name', text: st.name}),
    h('p', {class: 'by', text: [st.sire ? 'by ' + st.sire : null, st.foaled ? 'foaled ' + st.foaled : null].filter(Boolean).join(' · ')}),
    h('div', {class: 'row'}, priceLine(st), badge(st)),
    h('p', {class: 'why', text: why(st)}),
    st.shown ? h('p', {class: 'why', text: 'Of his ' + st.shown.n + ' foals shown in ' + st.shown.y + ', ' + st.shown.big + (st.shown.big === 1 ? ' has' : ' have') + ' won $20,000 or more so far.'}) : null,
    st.share && st.bids >= 2 ? h('p', {class: 'fine', text: 'Breedings to him have sold at auction for about ' + Math.round(st.share * 100) + '% of his fee.'}) : null,
    h('p', {class: 'fine'}, h('a', {href: 'explore.html?s=' + encodeURIComponent(st.id) + '#stallions', text: 'More about him'})));
}
function moneyInput(id, value, onset, label){
  var input = h('input', {id: id, type: 'text', inputmode: 'numeric', autocomplete: 'off', placeholder: '0', 'aria-label': label,
    value: value == null ? '' : Math.round(value).toLocaleString('en-US')});
  input.addEventListener('input', function(){
    var n = parseInt(input.value.replace(/[^0-9]/g, ''), 10);
    onset(isNaN(n) ? null : n, true);
  });
  return h('div', {class: 'money'}, h('span', {text: '$'}), input);
}
function chips(values, current, onpick, fmt){
  return h('div', {class: 'chips'}, values.map(function(v){
    return h('button', {type: 'button', class: 'chip', 'aria-pressed': current === v ? 'true' : 'false', text: fmt ? fmt(v) : money(v), onclick: function(){ onpick(v); }});
  }));
}

/* ---------- the three paths ---------- */
function mareFlow(){
  var out = [h('h2', {text: 'What can you spend on the breeding?'}),
    moneyInput('budget', state.budget, function(n, typing){ state.budget = n; results(typing); }, 'Your budget for the stud fee, in dollars'),
    chips([1000, 1500, 2000, 2500, 3000], state.budget, function(v){ state.budget = v; render(); }),
    h('div', {class: 'field'}, h('label', {for: 'sire', text: 'Who is her sire? (optional)'}),
      h('input', {id: 'sire', type: 'text', list: 'sires', value: state.sire, placeholder: 'Her sire’s name', autocomplete: 'off',
        oninput: function(e){ state.sire = e.target.value; results(true); }}),
      h('datalist', {id: 'sires'}, sireNames().map(function(n){ return h('option', {value: n}); })),
      h('small', {text: 'So we can leave out her close relatives.'})),
    h('div', {id: 'results'})];
  return out;
}
function sireNames(){
  var seen = {};
  S.forEach(function(s){ [s.name, s.sire, s.dam_sire].forEach(function(n){ if (n) seen[n.toUpperCase()] = 1; }); });
  return Object.keys(seen).sort();
}
function mareResults(){
  var b = state.budget, out = [];
  if (!b) return [h('p', {class: 'fine', text: 'Enter a budget to see your match.'})];
  var ms = norm(state.sire), related = [];
  var fit = PRICED.filter(function(s){
    if (s.price.fee > b) return false;
    if (ms && (norm(s.name) === ms || norm(s.sire) === ms)) { related.push(s.name); return false; }
    return true;
  });
  if (!fit.length){
    out.push(h('div', {class: 'note'}, h('b', {text: 'Nothing fits ' + money(b) + '. '}), 'The lowest stud fee we have is ' + money(LOWEST) + '. ',
      h('button', {class: 'linkbtn', type: 'button', text: 'Use ' + money(LOWEST), onclick: function(){ state.budget = LOWEST; render(); }})));
    return out;
  }
  var ranked = best(fit), top = ranked[0];
  if (top.rec.tier === 'none' && LOWEST_PROVEN){
    out.push(h('div', {class: 'note'}, h('b', {text: 'No stallion with foal results fits ' + money(b) + '. '}),
      'The lowest fee with a record is ' + money(LOWEST_PROVEN.price.fee) + ' (' + LOWEST_PROVEN.name + '). ',
      h('button', {class: 'linkbtn', type: 'button', text: 'Use ' + money(LOWEST_PROVEN.price.fee), onclick: function(){ state.budget = LOWEST_PROVEN.price.fee; render(); }})));
  }
  out.push(h('h2', {text: 'Your best match'}));
  out.push(card(top, null, true));
  if (ranked.length > 1){
    out.push(h('h2', {text: 'Also within your budget'}));
    ranked.slice(1, 3).forEach(function(s){ out.push(card(s)); });
  }
  if (ranked.length > 3){
    out.push(h('details', null, h('summary', {text: 'See all ' + ranked.length + ' that fit'}),
      h('ul', {class: 'list'}, ranked.map(function(s){
        return h('li', null, h('b', {text: s.name}), h('span', {class: 'r'}, money(s.price.fee), badge(s)));
      }))));
  }
  if (related.length) out.push(h('p', {class: 'fine', text: 'Left out as close relatives of your mare: ' + related.join(', ') + '.'}));
  out.push(h('div', {style: 'height:14px'}));
  out.push(expectBox(b));
  return out;
}
function noneFlow(){
  return [h('h2', {text: 'What is your total budget?'}),
    moneyInput('total', state.total, function(n, typing){ state.total = n; results(typing); }, 'Your total budget for the breeding and the mare, in dollars'),
    chips([5000, 10000, 20000, 50000], state.total, function(v){ state.total = v; render(); }),
    h('div', {id: 'results'})];
}
function noneResults(){
  var t = state.total, picks = [];
  if (!t) return [h('p', {class: 'fine', text: 'Enter a budget to see how to split it.'})];
  [Infinity, 1500, 1000].forEach(function(cap){
    var r = best(PROVEN.filter(function(s){ return s.price.fee <= cap && s.price.fee < t && picks.indexOf(s) < 0; }));
    if (r[0]) picks.push(r[0]);
  });
  if (!picks.length)
    return [h('div', {class: 'note'}, h('b', {text: 'That will not cover a breeding yet. '}),
      'The lowest stud fee with foal results is ' + money(LOWEST_PROVEN.price.fee) + ', before the cost of a mare.')];
  var labels = ['Strongest record', 'A lower fee', 'The lowest fee with a record'];
  return [h('h2', {text: 'Three ways to split it'}),
    h('div', {class: 'card'}, picks.map(function(s, i){
      return h('div', {class: 'plan'},
        h('div', null, h('span', {class: 'k', text: labels[i]}), h('b', {text: s.name}), h('div', null, badge(s))),
        h('div', null, h('span', {class: 'k', text: 'For the breeding'}), h('span', {class: 'v', text: money(s.price.fee)})),
        h('div', null, h('span', {class: 'k', text: 'Left for the mare'}), h('span', {class: 'v', text: money(t - s.price.fee)})));
    })),
    MARES ? h('p', {class: 'why', text: 'What a mare costs: at public online sales, most halter mares sold for ' + money(MARES.q1) + ' to ' + money(MARES.q3) +
      ' (' + MARES.n + ' sales, typical price ' + money(MARES.median) + ').'}) : null,
    h('p', {class: 'fine', text: 'We know what mares have sold for, not which mares are for sale today. Once you have one, come back and choose "A mare".'})];
}
function stallionFlow(){
  var names = S.slice().sort(function(a, b){ return a.name < b.name ? -1 : 1; });
  var sel = h('select', {id: 'mine', onchange: function(e){ state.mine = e.target.value; results(); }},
    h('option', {value: '', text: 'Choose a stallion'}), names.map(function(s){ return h('option', {value: s.id, selected: s.id === state.mine, text: s.name}); }));
  return [h('div', {class: 'note'}, h('b', {text: 'We cannot match mares yet. '}),
      MARES ? 'We know what halter mares have sold for (most between ' + money(MARES.q1) + ' and ' + money(MARES.q3) + '), but not which mares are for sale.'
            : 'So far the data covers stallions only.'),
    h('div', {class: 'field'}, h('label', {for: 'mine', text: 'See how your stallion compares'}), sel,
      h('small', {text: 'If he is one of the ' + S.length + ' stallions we track.'})),
    h('div', {id: 'results'})];
}
function stallionResults(){
  var st = S.filter(function(s){ return s.id === state.mine; })[0];
  if (!st) return [];
  var peers = PRICED.filter(function(s){ return s.rec.tier === st.rec.tier && s.id !== st.id; }).map(function(s){ return s.price.fee; });
  var out = [card(st, 'Your stallion', true)];
  if (peers.length){
    var lo = Math.min.apply(null, peers), hi = Math.max.apply(null, peers);
    var label = st.rec.tier === 'strong' ? 'a strong record' : st.rec.tier === 'some' ? 'some record' : 'no foal results yet';
    out.push(h('p', {class: 'why', text: 'The ' + peers.length + ' other stallions with ' + label + ' charge ' + (lo === hi ? money(lo) : money(lo) + ' to ' + money(hi)) + '.'}));
  }
  return out;
}

/* ---------- render ---------- */
var FLOWS = {mare: [mareFlow, mareResults], stallion: [stallionFlow, stallionResults], none: [noneFlow, noneResults]};
function results(typing){
  var box = document.getElementById('results');
  if (!box) return;
  box.replaceChildren();
  add(box, FLOWS[state.have][1]());
  if (typing) document.querySelectorAll('.chip').forEach(function(c){
    var v = state.have === 'mare' ? state.budget : state.total;
    c.setAttribute('aria-pressed', c.textContent === (v == null ? '' : money(v)) ? 'true' : 'false');
  });
}
function render(){
  app.replaceChildren();
  var opts = [['mare', 'A mare', 'Find a stallion for her'], ['stallion', 'A stallion', 'Find a mare for him'], ['none', 'No horse yet', 'Plan the stallion and the mare']];
  add(app, [h('h2', {text: 'What do you have?', style: 'margin-top:0'}),
    h('div', {class: 'choices', role: 'group', 'aria-label': 'What do you have?'}, opts.map(function(o){
      return h('button', {type: 'button', class: 'choice', 'aria-pressed': state.have === o[0] ? 'true' : 'false',
        onclick: function(){ state.have = o[0]; render(); }}, h('b', {text: o[1]}), h('span', {text: o[2]}));
    }))]);
  if (state.have){ add(app, FLOWS[state.have][0]()); results(); }
}
var foot = document.getElementById('foot');
