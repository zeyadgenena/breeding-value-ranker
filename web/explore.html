<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breeding Value Ranker: the data</title>
<meta name="description" content="Halter stallions: what a breeding costs, season by season, and a backtest of ranking them by foal quality per dollar.">
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --wash:rgba(11,11,11,.04);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --seq-lo:#cde2fb; --seq-hi:#0d366b;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --wash:rgba(255,255,255,.05);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --wash:rgba(255,255,255,.05);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{border-bottom:1px solid var(--border);background:var(--surface)}
.brand{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:18px 0 10px}
.brand h1{margin:0;font-size:20px;line-height:1.2}
.brand p{margin:2px 0 0;color:var(--ink2);font-size:14px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{background:var(--wash)}
.btn.small{padding:3px 9px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
main{padding:20px 0 48px}
h2{font-size:22px;line-height:1.25;margin:0 0 6px}
h3{font-size:16px;margin:0 0 2px}
.lede{color:var(--ink2);max-width:72ch;margin:0 0 18px}
.grid{display:grid;gap:16px}
.cols2{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.cols-even{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:900px){.cols2,.cols-even{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;min-width:0}
.card > .sub{color:var(--ink2);font-size:14px;margin:0 0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 16px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.tile .label{color:var(--ink2);font-size:13px}
.tile .value{font-size:26px;font-weight:600;line-height:1.2}
.tile .foot{color:var(--muted);font-size:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.filters input[type=search],.filters select{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
.filters input[type=search]{width:240px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;color:var(--ink2)}
.seg button + button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--grid);vertical-align:middle}
th{color:var(--ink2);font-weight:600;font-size:13px;white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.rowlink{cursor:pointer}
tbody tr.rowlink:hover{background:var(--wash)}
tbody tr[aria-selected="true"]{background:var(--wash);box-shadow:inset 3px 0 0 var(--s1)}
.name{font-weight:600}
.dim{color:var(--muted);font-size:12.5px}
.star{border:0;background:none;cursor:pointer;font-size:17px;line-height:1;padding:2px 4px;color:var(--muted)}
.star[aria-pressed="true"]{color:var(--s4)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2);margin:2px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.key-line{width:16px;height:0;border-top:2px solid currentColor;display:inline-block}
.key-dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:currentColor}
.key-tick{width:14px;height:0;border-top:3px solid var(--ink);display:inline-block}
.chart{position:relative;width:100%}
.chart svg{display:block;overflow:visible}
.chart svg text{font:12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--muted)}
.chart svg text.strong{fill:var(--ink);font-weight:600}
.chart svg text.label{fill:var(--ink2)}
.chart svg:focus{outline:2px solid var(--s1);outline-offset:2px;border-radius:6px}
details.tv{margin-top:10px}
details.tv summary{cursor:pointer;color:var(--ink2);font-size:13px}
details.tv .tablewrap{margin-top:8px;max-height:340px;overflow:auto}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.14);padding:8px 10px;font-size:13px;max-width:280px;display:none}
#tip .t{color:var(--ink2);margin-bottom:4px}
#tip .r{display:flex;align-items:center;gap:8px;justify-content:space-between}
#tip .r b{font-weight:600}
#tip .r span{color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.status{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.status svg{flex:none}
.banner{border:1px solid var(--border);border-left:4px solid var(--warn);background:var(--surface);border-radius:8px;padding:10px 12px;margin:0 0 14px;color:var(--ink2)}
.banner b{color:var(--ink)}
.checklist{list-style:none;margin:0;padding:0}
.checklist li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--grid)}
.checklist li:last-child{border-bottom:0}
.checklist small{display:block;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:999px;padding:4px 6px 4px 10px;background:var(--surface);font-size:13.5px}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:0 4px}
.empty{color:var(--ink2);padding:18px 4px}
.meta{color:var(--ink2);font-size:14px;margin:2px 0 10px}
.note{color:var(--ink2);font-size:13.5px;margin:10px 0 0}
.heat td,.heat th{text-align:center;border:0;padding:4px}
.heat td.cell{border-radius:8px;font-weight:600;font-size:16px;padding:16px 6px;min-width:56px}
.heat{table-layout:fixed}
.heat th.rowh{text-align:right;color:var(--ink2);font-weight:500;white-space:nowrap;padding-right:10px}
input[type=range]{width:220px;max-width:100%;accent-color:var(--s1)}
ol.steps{margin:6px 0 0;padding-left:20px;color:var(--ink2)}
ol.steps li{margin:4px 0}
ol.steps b{color:var(--ink)}
footer{border-top:1px solid var(--border);padding:16px 0 32px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div>
        <h1>Breeding Value Ranker: the data</h1>
        <p><a href="./">Back to the matcher</a> · Fees season by season, the whole market, and the backtest.</p>
      </div>
      <button class="btn small" id="theme" type="button" aria-label="Switch between light and dark">Dark</button>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  </div>
</header>
<main><div class="wrap" id="app"></div></main>
<footer><div class="wrap" id="foot"></div></footer>
<div id="tip" role="status" aria-live="polite"></div>
<script>/*__BVR_DATA__*/</script>
<script>
(function(){
'use strict';
var D = window.BVR;
var app = document.getElementById('app');
var NS = 'http://www.w3.org/2000/svg';
var SERIES = ['--s1','--s2','--s3','--s4','--s5','--s6'];

/* ---------- small helpers ---------- */
function h(tag, attrs){
  var el = document.createElement(tag), i, k;
  attrs = attrs || {};
  for (k in attrs){
    if (attrs[k] == null || attrs[k] === false) continue;
    if (k === 'text') el.textContent = attrs[k];
    else if (k === 'class') el.className = attrs[k];
    else if (k.slice(0,2) === 'on') el.addEventListener(k.slice(2), attrs[k]);
    else if (k === 'style') el.style.cssText = attrs[k];
    else el.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
  }
  for (i = 2; i < arguments.length; i++) add(el, arguments[i]);
  return el;
}
function add(el, kid){
  if (kid == null || kid === false) return;
  if (Array.isArray(kid)) { kid.forEach(function(k){ add(el, k); }); return; }
  el.appendChild(typeof kid === 'string' || typeof kid === 'number' ? document.createTextNode(String(kid)) : kid);
}
function s(tag, attrs, parent){
  var el = document.createElementNS(NS, tag), k, v;
  for (k in attrs){
    v = attrs[k];
    if (v == null) continue;
    if (k === 'text') el.textContent = v;
    else if ((k === 'fill' || k === 'stroke') && String(v).indexOf('var(') === 0) el.style[k] = v;
    else el.setAttribute(k, v);
  }
  if (parent) parent.appendChild(el);
  return el;
}
function cv(name){ return 'var(' + name + ')'; }
function money(v){ return v == null ? '' : '$' + Math.round(v).toLocaleString('en-US'); }
function pct(v){ return v == null ? '' : Math.round(v * 100) + '%'; }
function num(v, d){ return v == null ? '' : Number(v).toFixed(d == null ? 1 : d); }
function median(a){
  if (!a.length) return null;
  var b = a.slice().sort(function(x, y){ return x - y; }), m = Math.floor(b.length / 2);
  return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2;
}
function niceTicks(max, want){
  if (!(max > 0)) return [0, 1];
  var raw = max / (want || 4), pow = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10)), n = raw / pow;
  var step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * pow, out = [], v;
  for (v = 0; v < max + step * 0.999; v += step) out.push(Math.round(v * 1e6) / 1e6);
  return out;
}
function range(a, b){ var o = []; for (var i = a; i <= b; i++) o.push(i); return o; }
function store(key, val){
  try {
    if (val === undefined) return JSON.parse(localStorage.getItem(key));
    localStorage.setItem(key, JSON.stringify(val));
  } catch (e) { return null; }
}

/* ---------- tooltip ---------- */
var tipEl = document.getElementById('tip');
var tip = {
  show: function(evt, title, rows){
    tipEl.replaceChildren();
    if (title) tipEl.appendChild(h('div', {class: 't', text: title}));
    (rows || []).forEach(function(r){
      var key = r.color ? h('i', {class: r.dot ? 'key-dot' : 'key-line', style: 'color:' + r.color}) : null;
      tipEl.appendChild(h('div', {class: 'r'}, h('span', null, key, r.label), h('b', {text: r.value})));
    });
    tipEl.style.display = 'block';
    var w = tipEl.offsetWidth, hh = tipEl.offsetHeight, x = evt.clientX + 14, y = evt.clientY + 14;
    if (x + w > window.innerWidth - 8) x = evt.clientX - w - 14;
    if (y + hh > window.innerHeight - 8) y = evt.clientY - hh - 14;
    tipEl.style.left = Math.max(8, x) + 'px';
    tipEl.style.top = Math.max(8, y) + 'px';
  },
  hide: function(){ tipEl.style.display = 'none'; }
};

/* ---------- prepare the stallion data ---------- */
var minY = Infinity, maxY = -Infinity, byId = {};
D.stallions.forEach(function(st){ st.fees.forEach(function(r){ if (r.y < minY) minY = r.y; if (r.y > maxY) maxY = r.y; }); });
var SEASONS = range(minY, maxY);
D.stallions.forEach(function(st){
  byId[st.id] = st;
  var bySeason = {}, newest = null;
  st.listed = {}; st.pt = {}; st.conflict = {}; st.bids = []; st.medBid = {};
  st.fees.forEach(function(r){
    if (r.basis === 'auction') { if (r.fee != null) st.bids.push(r); return; }
    (bySeason[r.y] = bySeason[r.y] || []).push(r);
    if (r.y >= maxY - D.fee_staleness && (!newest || r.y > newest.y || (r.y === newest.y && r.d > newest.d))) newest = r;
  });
  Object.keys(bySeason).forEach(function(y){
    var rows = bySeason[y].sort(function(a, b){ return a.d < b.d ? -1 : a.d > b.d ? 1 : 0; });
    var last = rows[rows.length - 1], seen = {};
    rows.forEach(function(r){ if (r.fee != null) seen[r.fee] = 1; });
    if (last.fee != null) st.listed[y] = last.fee; else st.pt[y] = 1;
    if (Object.keys(seen).length > 1) st.conflict[y] = Object.keys(seen).map(Number).sort(function(a, b){ return a - b; });
  });
  st.seasons = Object.keys(st.listed).map(Number).sort(function(a, b){ return a - b; });
  st.latest = st.seasons.length ? {y: st.seasons[st.seasons.length - 1], fee: st.listed[st.seasons[st.seasons.length - 1]]} : null;
  st.current = newest && newest.fee != null ? {y: newest.y, fee: newest.fee} : null;
  var ratios = [], per = {};
  st.bids.forEach(function(b){
    (per[b.y] = per[b.y] || []).push(b.fee);
    if (st.listed[b.y]) ratios.push(b.fee / st.listed[b.y]);
  });
  Object.keys(per).forEach(function(y){ st.medBid[y] = median(per[y]); });
  st.bidShare = median(ratios);
});
var rankById = {};
D.real.ranking.forEach(function(r){ rankById[r.id] = r; });

/* ---------- state ---------- */
var TABS = [['overview','Overview'],['stallions','Stallions'],['shortlist','Shortlist'],['market','Market'],
            ['backtest','Backtest'],['sample','Sample size'],['about','About']];
var state = {
  tab: 'overview', selected: null, query: '', filter: 'all', sort: {key: 'name', dir: 1},
  shortlist: (store('bvr.shortlist') || []).filter(function(id){ return byId[id]; }).slice(0, 6),
  basis: 'listed', dataset: D.real.ranking.length ? 'real' : D.synthetic[0].key, mare: 50
};
function setHash(){ try { history.replaceState(null, '', '#' + state.tab); } catch (e) {} }
function go(tab){ state.tab = tab; setHash(); render(); window.scrollTo(0, 0); }
function toggleShort(id){
  var i = state.shortlist.indexOf(id);
  if (i >= 0) state.shortlist.splice(i, 1);
  else if (state.shortlist.length < 6) state.shortlist.push(id);
  else { alert('The shortlist holds six stallions. Remove one first.'); return; }
  store('bvr.shortlist', state.shortlist);
  render();
}
function colorOf(id){ var i = state.shortlist.indexOf(id); return i < 0 ? null : cv(SERIES[i]); }

/* ---------- shared pieces ---------- */
function card(title, sub){
  var c = h('section', {class: 'card'}, title ? h('h3', {text: title}) : null, sub ? h('p', {class: 'sub', text: sub}) : null);
  for (var i = 2; i < arguments.length; i++) add(c, arguments[i]);
  return c;
}
function tile(label, value, foot){
  return h('div', {class: 'tile'}, h('div', {class: 'label', text: label}), h('div', {class: 'value', text: value}),
           foot ? h('div', {class: 'foot', text: foot}) : null);
}
function tableView(headers, rows, label){
  var t = h('table'), tr = h('tr');
  headers.forEach(function(x){ tr.appendChild(h('th', {text: x.t || x, class: x.num ? 'num' : null})); });
  t.appendChild(h('thead', null, tr));
  var tb = h('tbody');
  rows.forEach(function(r){
    var row = h('tr');
    r.forEach(function(c, i){
      var td = h('td', {class: headers[i] && headers[i].num ? 'num' : null});
      if (c && c.href) td.appendChild(h('a', {href: c.href, target: '_blank', rel: 'noopener', text: c.text}));
      else td.textContent = c == null ? '' : c;
      row.appendChild(td);
    });
    tb.appendChild(row);
  });
  t.appendChild(tb);
  return h('details', {class: 'tv'}, h('summary', {text: label || 'Show as table'}), h('div', {class: 'tablewrap'}, t));
}
function legend(items){
  return h('div', {class: 'legend'}, items.map(function(it){
    return h('span', null, h('i', {class: it.kind === 'dot' ? 'key-dot' : it.kind === 'tick' ? 'key-tick' : 'key-line',
                                   style: it.color ? 'color:' + it.color : null}), it.label);
  }));
}
function statusIcon(kind){
  var col = kind === 'good' ? '--good' : kind === 'bad' ? '--crit' : '--muted';
  var g = s('svg', {width: 18, height: 18, viewBox: '0 0 18 18', 'aria-hidden': 'true'});
  s('circle', {cx: 9, cy: 9, r: 8, fill: kind === 'todo' ? 'none' : cv(col), stroke: cv(col), 'stroke-width': 1.5}, g);
  if (kind === 'good') s('path', {d: 'M5 9.4l2.6 2.6L13 6.6', fill: 'none', stroke: '#fff', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round'}, g);
  if (kind === 'bad') s('path', {d: 'M6 6l6 6M12 6l-6 6', fill: 'none', stroke: '#fff', 'stroke-width': 2, 'stroke-linecap': 'round'}, g);
  return g;
}
function chartBox(draw){
  var box = h('div', {class: 'chart'});
  box._draw = function(){ if (box.clientWidth) draw(box, box.clientWidth); };
  return box;
}
function drawAll(){ app.querySelectorAll('.chart').forEach(function(b){ if (b._draw) b._draw(); }); }

/* ---------- chart primitives ---------- */
function frame(box, W, H, m, label){
  var svg = s('svg', {width: W, height: H, viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': label});
  box.replaceChildren(svg);
  return {svg: svg, W: W, H: H, m: m, iw: W - m.l - m.r, ih: H - m.t - m.b};
}
function yAxis(f, ticks, fmt, top){
  var y = function(v){ return f.m.t + f.ih - (v / top) * f.ih; };
  ticks.forEach(function(t){
    s('line', {x1: f.m.l, x2: f.m.l + f.iw, y1: y(t), y2: y(t), stroke: cv(t === 0 ? '--axis' : '--grid'), 'stroke-width': 1}, f.svg);
    s('text', {x: f.m.l - 8, y: y(t) + 4, 'text-anchor': 'end', text: fmt(t)}, f.svg);
  });
  return y;
}
function xPoints(f, cats, pad){
  var p = pad == null ? 24 : pad, n = cats.length, span = f.iw - 2 * p, x = {};
  cats.forEach(function(c, i){ x[c] = f.m.l + p + (n > 1 ? span * i / (n - 1) : span / 2); });
  var every = Math.ceil(n / Math.max(2, Math.floor(f.iw / 46)));
  cats.forEach(function(c, i){
    if ((n - 1 - i) % every === 0) s('text', {x: x[c], y: f.m.t + f.ih + 18, 'text-anchor': 'middle', text: c}, f.svg);
  });
  return x;
}
function lineSegments(svg, pts, color){
  var seg = [], i;
  function flush(){
    if (seg.length > 1) s('path', {d: 'M' + seg.map(function(p){ return p.x.toFixed(1) + ' ' + p.y.toFixed(1); }).join('L'),
      fill: 'none', stroke: color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round'}, svg);
    seg = [];
  }
  for (i = 0; i < pts.length; i++){
    if (i && pts[i].i !== pts[i - 1].i + 1) flush();
    seg.push(pts[i]);
  }
  flush();
  pts.forEach(function(p){ s('circle', {cx: p.x, cy: p.y, r: 4, fill: color, stroke: cv('--surface'), 'stroke-width': 2}, svg); });
}
function hoverX(f, cats, x, onShow){
  var cross = s('line', {y1: f.m.t, y2: f.m.t + f.ih, stroke: cv('--axis'), 'stroke-width': 1, visibility: 'hidden'}, f.svg);
  var hit = s('rect', {x: f.m.l, y: f.m.t, width: f.iw, height: f.ih, fill: 'transparent'}, f.svg), cur = -1;
  function at(i, evt){
    cur = i; cross.setAttribute('x1', x[cats[i]]); cross.setAttribute('x2', x[cats[i]]); cross.setAttribute('visibility', 'visible');
    onShow(cats[i], evt);
  }
  function nearest(evt){

      tableView(['Ranked in', 'Foals born', {t: 'Pool', num: true}, {t: 'Top picks', num: true}, {t: 'Cheap but average', num: true}, {t: 'Random, similar fee', num: true}, {t: 'Picks beat', num: true}],
        usable.map(function(w){ return [w.asof, w.crops, w.pool, num(w.groups['Top value picks'][key]), num(w.groups['Cheap but average'][key]),

  return [
    h('h2', {text: 'About this page'}),
    h('p', {class: 'lede', text: 'A personal research tool. It asks whether some halter stallions are underpriced for the foals they sire, and tests the idea on past data before trusting it.'}),
    h('div', {class: 'grid cols-even'},
      card('How the ranking works', null, h('ol', {class: 'steps'},
        h('li', null, h('b', {text: 'Link. '}), 'Each foal is matched to its sire and dam by registration number.'),
        h('li', null, h('b', {text: 'Score. '}), 'Halter points become a 0 to 100 percentile within the foal’s own crop year. Unshown foals count as zero.'),
        h('li', null, h('b', {text: 'Effect. '}), 'How far a stallion’s foals sit above what their crop and their dams predict, shrunk toward zero when he has few foals.'),
        h('li', null, h('b', {text: 'Value. '}), 'Effect divided by stud fee, per $1,000. A below-average stallion is never good value.'),
        h('li', null, h('b', {text: 'Backtest. '}), 'Rank with data through one year, pay the next season’s fee, judge the foals born two and three years on.')), links),
      card('Where the prices come from', null,
        h('p', {class: 'lede', text: 'Advertised fees and winning bids come from public stallion-service auction pages, archived copies of the QStallions directory and each stallion’s own directory page. Every figure links to its source in the fee table on the Stallions tab.'}),
        h('p', {class: 'note', text: 'Sources disagree on whether a fee includes the chute or booking fee. Registration numbers on auction pages are typed by consignors, so check them before ordering records. The stallions here are those offered at a futurity auction in at least three seasons, plus seven from the directory; they are not a random sample.'}),
        h('p', {class: 'note', text: 'Foal show records are not public per foal. They come from AQHA through a member login and are not in this page yet.'})))
  ];
}

/* ---------- render ---------- */
var VIEWS = {overview: viewOverview, stallions: viewStallions, shortlist: viewShortlist, market: viewMarket, backtest: viewBacktest, sample: viewSample, about: viewAbout};
function render(){
  tip.hide();
  var nav = document.getElementById('tabs');
  nav.replaceChildren();
  TABS.forEach(function(t){
    var label = t[1] + (t[0] === 'shortlist' && state.shortlist.length ? ' (' + state.shortlist.length + ')' : '');
    nav.appendChild(h('button', {type: 'button', role: 'tab', 'aria-selected': state.tab === t[0] ? 'true' : 'false', text: label, onclick: function(){ go(t[0]); }}));
  });
  var list = document.getElementById('list'), keep = list ? list.scrollTop : 0;
  app.replaceChildren();
  add(app, VIEWS[state.tab]());
  list = document.getElementById('list');
  if (list) list.scrollTop = keep;
  drawAll();
}
var foot = document.getElementById('foot');
foot.textContent = 'Built ' + D.generated + ' from ' + D.source + '. ' + D.stallions.length + ' stallions. Personal research, not advice. ';
if (D.repo) foot.appendChild(h('a', {href: D.repo, text: 'Source on GitHub'}));

var themeBtn = document.getElementById('theme');
function isDark(){
  var t = document.documentElement.getAttribute('data-theme');
  return t ? t === 'dark' : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function paintTheme(){ themeBtn.textContent = isDark() ? 'Light' : 'Dark'; }
var saved = store('bvr.theme'); if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
themeBtn.addEventListener('click', function(){ var next = isDark() ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', next); store('bvr.theme', next); paintTheme(); });
paintTheme();
if (window.matchMedia) try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintTheme); } catch (e) {}

var fromHash = (location.hash || '').slice(1);
if (VIEWS[fromHash]) state.tab = fromHash;
try { var want = new URLSearchParams(location.search).get('s'); if (want && byId[want]){ state.selected = want; if (!VIEWS[fromHash]) state.tab = 'stallions'; } } catch (e) {}
window.addEventListener('hashchange', function(){ var t = location.hash.slice(1); if (VIEWS[t] && t !== state.tab){ state.tab = t; render(); } });
var rz; window.addEventListener('resize', function(){ clearTimeout(rz); rz = setTimeout(drawAll, 120); });
render();
})();
</script>
</body>
