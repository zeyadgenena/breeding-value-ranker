<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breeding Value Ranker</title>
<meta name="description" content="Tell us what you have and what you can spend. We rank every halter stallion in your budget by the return you can expect.">
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --line:rgba(11,11,11,.12); --wash:rgba(11,11,11,.04); --accent:#2a78d6; --good:#0ca30c;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --line:rgba(255,255,255,.14); --wash:rgba(255,255,255,.06); --accent:#3987e5;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:28px 16px 56px}
h1{font-size:30px;line-height:1.15;margin:0 0 6px}
.tag{color:var(--ink2);margin:0 0 30px;font-size:18px}
h2{font-size:20px;margin:30px 0 12px}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.choices{grid-template-columns:minmax(0,1fr)}}
.choice{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;cursor:pointer}
.choice b{display:block;font-size:18px}
.choice span{color:var(--ink2);font-size:14.5px}
.choice:hover{background:var(--wash)}
.choice[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.money{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 16px;max-width:260px}
.money:focus-within{border-color:var(--ink)}
.money span{font-size:26px;color:var(--muted)}
.money input{border:0;outline:0;background:none;font-size:26px;font-weight:600;width:100%;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:15px}
.chip:hover{background:var(--wash)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.field{margin:18px 0 0}
.field label,.field .lab{display:block;font-weight:600;margin:0 0 6px}
.field small{display:block;color:var(--ink2);margin:6px 0 0;font-size:14.5px}
.field input[type=text],.field select{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;width:100%;max-width:360px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1.5px solid var(--line);border-radius:12px;overflow:hidden;max-width:520px}
.seg button{border:0;background:var(--surface);padding:10px 14px;cursor:pointer;color:var(--ink2);text-align:left}
.seg button + button{border-left:1px solid var(--line)}
@media (max-width:560px){.seg{grid-template-columns:minmax(0,1fr)}.seg button + button{border-left:0;border-top:1px solid var(--line)}}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.card{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:18px 20px;margin:0 0 12px}
.card.best{border:2px solid var(--ink)}
.eyebrow{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);font-weight:600;margin:0 0 4px}
.name{font-size:24px;font-weight:700;line-height:1.2;margin:0}
.by{color:var(--ink2);font-size:14.5px;margin:2px 0 10px}
.row{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;margin:0 0 8px}
.price{font-size:20px;font-weight:700}
.price small{font-size:14.5px;font-weight:400;color:var(--ink2);margin-left:6px}
.badge{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14.5px;white-space:nowrap}
.badge i{width:11px;height:11px;border-radius:50%;display:inline-block;border:2px solid var(--muted)}
.badge.strong i{background:var(--good);border-color:var(--good)}
.badge.some i{background:var(--muted)}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
.nums.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:560px){.nums,.nums.two{grid-template-columns:minmax(0,1fr)}}
.num{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.num .k{display:block;color:var(--ink2);font-size:13.5px}
.num .v{display:block;font-size:24px;font-weight:700;line-height:1.25}
.num .s{display:block;color:var(--ink2);font-size:13px}
.why{margin:0 0 8px;color:var(--ink)}
.fine{color:var(--ink2);font-size:14.5px;margin:6px 0 0}
.note{border-left:4px solid var(--accent);background:var(--surface);border-radius:8px;padding:12px 14px;margin:14px 0;color:var(--ink2)}
.note b{color:var(--ink)}
.linkbtn{border:0;background:none;padding:0;text-decoration:underline;cursor:pointer;color:inherit}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
th{color:var(--ink2);font-weight:600;font-size:13px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.n{white-space:nowrap}
td .sub{display:block;color:var(--ink2);font-size:13px;font-weight:400}
td .badge{font-size:13px;font-weight:400;white-space:normal}
td .badge i{flex:none}
tr.top td{background:var(--wash);font-weight:600}
@media (max-width:560px){th.wide,td.wide{display:none}th,td{padding:9px 6px}th:first-child,td:first-child{padding-left:10px}th:last-child,td:last-child{padding-right:10px}table{font-size:14.5px}th{font-size:12.5px}}
details{margin:14px 0 0}
summary{cursor:pointer;font-weight:600}
ul.plain{margin:6px 0 0;padding-left:20px}
ul.plain li{margin:8px 0}
footer{margin:40px 0 0;padding:18px 0 0;border-top:1px solid var(--line);color:var(--ink2);font-size:15px}
footer ul{margin:10px 0 0;padding-left:20px}
footer li{margin:6px 0}
</style>
</head>

    else if (k === 'class') el.className = attrs[k];

function money(v){ return '$' + Math.round(v).toLocaleString('en-US'); }
function round(v){
  if (v >= 1e6) return '$' + (v / 1e6).toFixed(1) + ' million';

}

/* ---------- two ways to rank ---------- */
function byWinner(list){            // tested on the 2019 to 2025 seasons: last year's foal winnings x trend
  return list.slice().sort(function(a, b){ return b.score - a.score || a.price.fee - b.price.fee || (a.name < b.name ? -1 : 1); });
}
function byReturn(list){            // likely sale price as a yearling, divided by the stud fee

  });
}
function unpriced(list){ return byWinner(list.filter(function(s){ return !priced(s); })); }

function badge(st){

function feeLine(st){

function record(st){
  var r = st.rec;
  if (r.tier === 'none' || !r.y) return 'None of his foals are on the halter leaderboards for ' + SPAN + '.';

  if (r.prev > 0 && r.e / r.prev >= 1.2) s += ' That is up from ' + round(r.prev) + ' the year before.';

  return s;
}

}
function saleNums(st){
  var x = st.sale;
  return [h('div', {class: 'nums'},
      num('Sold as a weanling', money(x.weanling), times(x.weanling_multiple) + ' the fee, about 18 months after breeding'),
      num('Sold as a yearling', money(x.typical), times(x.multiple) + ' the fee, about 2 years after breeding'),

}
function extras(st){
  return [

function whyReturn(top, ranked, pool){
  var out = [], t;
  if (ranked.length === 1) t = 'He is the only stallion in your budget whose foals we can price.';
  else {
    var prices = ranked.map(function(s){ return s.sale.typical; }), lo = Math.min.apply(null, prices), hi = Math.max.apply(null, prices);
    t = 'At public auction a yearling’s price barely depends on his sire. ' +
      (lo === hi ? 'Every stallion in your budget comes out at about ' + money(lo) : 'Every stallion in your budget comes out between ' + money(lo) + ' and ' + money(hi)) +
      '. So the stud fee decides the return, and ' +
      (ranked.every(function(s){ return s.price.fee >= top.price.fee; }) ? 'his is the lowest we can price.' : 'his is among the lowest.');
    var same = ranked.filter(function(s){ return s.price.fee === top.price.fee && s.id !== top.id; }).length;
    if (same) t += ' ' + same + (same === 1 ? ' other costs' : ' others cost') + ' the same. ' +
      (top.rec.y === M.latest && top.rec.e > 0 ? 'He is first because his foals’ winnings are the strongest of that group.' : 'None of them had foals on last year’s list, so they are level.');
  }
  out.push(h('p', {class: 'why', text: t}));
  var star = byWinner(pool)[0];
  if (star && star.id !== top.id && priced(star)){
    var more = star.sale.typical - top.sale.typical, dearer = star.price.fee - top.price.fee;
    out.push(h('p', {class: 'why', text: 'The strongest record in your budget is ' + star.name + ' at ' + money(star.price.fee) + '. His yearling is likely to sell for ' +
      money(star.sale.typical) + (more > 0 ? ', ' + money(more) + ' more' : ', no more') + (dearer > 0 ? ', for a fee ' + money(dearer) + ' higher' : '') +
      '. That is a return of ' + times(star.sale.multiple) + '. His record buys a better chance of a prize winner, not a higher auction price.'}));
  }
  return out;
}
function returnCard(top, ranked, pool, split){
  return h('article', {class: 'card best'},

  var rows = ranked.map(function(s, i){ return {s: s, i: i}; });

      h('tbody', null, vis.map(function(r){

          h('td', null, r.s.name, h('span', {class: 'sub'}, badge(r.s)),

};
function moneyInput(id, value, onset, label){

  return h('details', null, h('summary', {text: 'See all ' + PM.scorecard.length + ' versions we trained'}),
    h('p', {class: 'fine', text: 'Each version was trained with one auction left out, then scored on that auction, for every auction in turn. A version was kept only if it predicted sales it had not seen better than the one before.'}),

      })))));

function expectBox(budget){
  var items = [], R = M.record;
  if (PM){
    items.push(h('li', null, 'The sale prices are rough. We trained ' + PM.rounds + ' versions of a price model on ' + PM.sales + ' public sales and tried ' + PM.combinations +
      ' combinations of factors. The best explains about ' + Math.round(PM.explained * 100) + '% of the difference between one sale and the next, and nearly all of that is the horse\u2019s age, sex and the year it sold, not its sire. Two sales in three landed between half and double its estimate.',
      scorecard()));
    items.push(h('li', {text: 'They are public online auction prices. The best halter prospects usually change hands privately, at prices nobody publishes, so a top sire’s best foals can be worth more than this shows.'}));
    items.push(h('li', {text: 'A big resale is rare. Of the ' + PM.sales + ' sales, ' + PM.at_least_10000 + ' reached $10,000 and ' + (PM.at_least_20000 || 'none') +

  }
  if (R){
    var rows = R.by_budget, row = rows[0];
    rows.forEach(function(x){ if (x.budget === null ? budget >= 2500 : budget >= x.budget) row = x; });

function noEstimate(list){
  if (!list.length || !PM) return null;
  return h('details', null, h('summary', {text: list.length + ' more in your budget with no sale estimate'}),
    h('p', {class: 'fine', text: 'The public sales only include young horses by stallions standing for ' + money(PM.fee_range[0]) + ' to ' + money(PM.fee_range[1]) +
      '. Outside that range there is nothing to estimate a sale price from.'}),
    h('ul', {class: 'plain'}, list.map(function(s){ return h('li', null, s.name + ', ' + money(s.price.fee) + ' ', badge(s)); })));
}
function useButton(v){ return h('button', {class: 'linkbtn', type: 'button', text: 'Use ' + money(v), onclick: function(){ state[state.have === 'mare' ? 'budget' : 'total'] = v; render(); }}); }

/* ---------- a mare ---------- */
function mareFlow(){
  return [h('h2', {text: 'What can you spend on the breeding?'}),
    moneyInput('budget', state.budget, function(n, typing){ state.budget = n; results(typing); }, 'Your budget for the stud fee, in dollars'),
    chips([1000, 1500, 2000, 2500, 3000], state.budget, function(v){ state.budget = v; render(); }),
    h('div', {class: 'field'}, h('label', {for: 'sire', text: 'Who is her sire? (optional)'}),
      h('input', {id: 'sire', type: 'text', list: 'sires', value: state.sire, placeholder: 'Her sire’s name', autocomplete: 'off',
        oninput: function(e){ state.sire = e.target.value; results(true); }}),
      h('datalist', {id: 'sires'}, sireNames().map(function(n){ return h('option', {value: n}); })),
      h('small', {text: 'So we can leave out her close relatives.'})),
    h('div', {id: 'results'})];
}
function sireNames(){
  var seen = {};
  S.forEach(function(s){ [s.name, s.sire, s.dam_sire].forEach(function(n){ if (n) seen[n.toUpperCase()] = 1; }); });
  return Object.keys(seen).sort();
}
function mareResults(){
  var b = state.budget, out = [];
  if (!b) return [h('p', {class: 'fine', text: 'Enter a budget to see every option, ranked.'})];
  var ms = norm(state.sire), related = [];
  var fit = PRICED.filter(function(s){
    if (s.price.fee > b) return false;
    if (ms && (norm(s.name) === ms || norm(s.sire) === ms)) { related.push(s.name); return false; }
    return true;
  });
  if (!fit.length)
    return [h('div', {class: 'note'}, h('b', {text: 'Nothing fits ' + money(b) + '. '}), 'The lowest stud fee we have is ' + money(LOWEST) + '. ', useButton(LOWEST))];
  out.push(goalToggle());
  var star = byWinner(fit)[0];
  if (state.goal === 'sell'){
    var ranked = byReturn(fit);
    if (!ranked.length)
      out.push(h('div', {class: 'note'}, h('b', {text: 'We cannot estimate a sale price at ' + money(b) + '. '}),
        'The public sales only include young horses by stallions standing for ' + money(PM.fee_range[0]) + ' or more. ', useButton(PM.fee_range[0])));
    else {
      out.push(h('h2', {text: 'Your best return'}));
      out.push(returnCard(ranked[0], ranked, fit));
      out.push(h('h2', {text: ranked.length === 1 ? 'The one option we can price' : 'All ' + ranked.length + ' options, ranked by return'}));
      out.push(rankTable(ranked, [COL.fee, COL.sale, COL.ret], star.id));
    }
    out.push(noEstimate(unpriced(fit)));
  } else {
    var w = byWinner(fit);
    out.push(h('h2', {text: 'Your best chance of a prize winner'}));
    out.push(winnerCard(w[0]));
    out.push(h('h2', {text: 'All ' + w.length + ' options, ranked by foal winnings and their trend'}));
    out.push(rankTable(w, [COL.fee, COL.won, COL.ret]));
  }
  if (related.length) out.push(h('p', {class: 'fine', text: 'Left out as close relatives of your mare: ' + related.join(', ') + '.'}));
  out.push(expectBox(b));
  return out;
}

/* ---------- no horse yet ---------- */
function noneFlow(){
  return [h('h2', {text: 'What is your total budget?'}),
    moneyInput('total', state.total, function(n, typing){ state.total = n; results(typing); }, 'Your total budget for the breeding and the mare, in dollars'),
    chips([5000, 10000, 20000, 50000], state.total, function(v){ state.total = v; render(); }),
    h('div', {id: 'results'})];
}
function split(st, total){
  var left = total - st.price.fee;
  return h('div', {class: 'nums two'}, num('For the breeding', money(st.price.fee)),
    num('Left for the mare', money(left), MARES ? (left >= MARES.q1 ? 'most mares sold for ' + money(MARES.q1) + ' to ' + money(MARES.q3) : 'most mares sold for ' + money(MARES.q1) + ' or more') : null));
}
function noneResults(){
  var t = state.total;
  if (!t) return [h('p', {class: 'fine', text: 'Enter a budget to see every way to split it, ranked.'})];
  var fit = PRICED.filter(function(s){ return s.price.fee < t; });
  var sell = state.goal === 'sell', ranked = sell ? byReturn(fit) : byWinner(fit);
  if (!ranked.length)
    return [h('div', {class: 'note'}, h('b', {text: 'That will not cover a breeding yet. '}),
      'The lowest stud fee we can price is ' + money(PM ? PM.fee_range[0] : LOWEST) + ', before the cost of a mare.')];
  var top = ranked[0], star = byWinner(fit)[0], out = [goalToggle()];
  out.push(h('h2', {text: sell ? 'Your best return' : 'Your best chance of a prize winner'}));
  out.push(sell ? returnCard(top, ranked, fit, split(top, t)) : winnerCard(top, null, split(top, t)));
  out.push(h('h2', {text: 'All ' + ranked.length + ' ways to split ' + money(t) + ', ranked'}));
  out.push(rankTable(ranked, [['Breeding', COL.fee[1]], ['Left for the mare', function(s){ return money(t - s.price.fee); }, 'wide'],
    ['Yearling sells for', COL.sale[1]], ['Return', COL.ret[1]]], sell ? star.id : null));
  if (sell) out.push(noEstimate(unpriced(fit)));
  out.push(h('p', {class: 'fine', text: 'The return compares the yearling\u2019s likely price with the stud fee. The mare is still yours to breed again or sell' +
    (MARES ? ': at public online sales most halter mares sold for ' + money(MARES.q1) + ' to ' + money(MARES.q3) + ' (' + MARES.n + ' sales).' : '.') +
    ' A better mare should give a better foal, but the public sales do not show by how much, so the foal’s price here does not change with what you spend on her.'}));
  out.push(expectBox(t));
  return out;
}

/* ---------- a stallion ---------- */
function stallionFlow(){
  var names = S.slice().sort(function(a, b){ return a.name < b.name ? -1 : 1; });
  var sel = h('select', {id: 'mine', onchange: function(e){ state.mine = e.target.value; results(); }},
    h('option', {value: '', text: 'Choose a stallion'}), names.map(function(s){ return h('option', {value: s.id, selected: s.id === state.mine, text: s.name}); }));
  return [h('div', {class: 'note'}, h('b', {text: 'We cannot match mares yet. '}),
      MARES ? 'We know what halter mares have sold for (most between ' + money(MARES.q1) + ' and ' + money(MARES.q3) + '), but not which mares are for sale.' : 'So far the data covers stallions only.'),
    h('div', {class: 'field'}, h('label', {for: 'mine', text: 'See how your stallion compares'}), sel,
      h('small', {text: 'If he is one of the ' + S.length + ' stallions we track.'})),
    h('div', {id: 'results'})];
}
function stallionResults(){
  var st = S.filter(function(s){ return s.id === state.mine; })[0];
  if (!st) return [];
  if (!st.price) return [h('div', {class: 'note'}, h('b', {text: st.name + ' has no published price. '}), record(st))];
  var out = [winnerCard(st, 'Your stallion')];
  var peers = PRICED.filter(function(s){ return s.rec.tier === st.rec.tier && s.id !== st.id; }).map(function(s){ return s.price.fee; });
  if (peers.length){
    var lo = Math.min.apply(null, peers), hi = Math.max.apply(null, peers);
    var label = st.rec.tier === 'strong' ? 'a strong record' : st.rec.tier === 'some' ? 'some record' : 'no foal results yet';
    out.push(h('p', {class: 'why', text: 'The ' + peers.length + ' other stallions with ' + label + ' charge ' + (lo === hi ? money(lo) : money(lo) + ' to ' + money(hi)) + '.'}));
  }
  return out;
}

/* ---------- render ---------- */
var FLOWS = {mare: [mareFlow, mareResults], stallion: [stallionFlow, stallionResults], none: [noneFlow, noneResults]};
function results(typing){
  var box = document.getElementById('results');
  if (!box) return;
  box.replaceChildren();
  add(box, FLOWS[state.have][1]());
  if (typing) document.querySelectorAll('.chip').forEach(function(c){
    var v = state.have === 'mare' ? state.budget : state.total;
    c.setAttribute('aria-pressed', c.textContent === (v == null ? '' : money(v)) ? 'true' : 'false');
  });
}
function render(){
  app.replaceChildren();
  var opts = [['mare', 'A mare', 'Find a stallion for her'], ['stallion', 'A stallion', 'Find a mare for him'], ['none', 'No horse yet', 'Plan the stallion and the mare']];
  add(app, [h('h2', {text: 'What do you have?', style: 'margin-top:0'}),
    h('div', {class: 'choices', role: 'group', 'aria-label': 'What do you have?'}, opts.map(function(o){
      return h('button', {type: 'button', class: 'choice', 'aria-pressed': state.have === o[0] ? 'true' : 'false',
        onclick: function(){ state.have = o[0]; state.all = false; render(); }}, h('b', {text: o[1]}), h('span', {text: o[2]}));
    }))]);
  if (state.have){ add(app, FLOWS[state.have][0]()); results(); }
}
var foot = document.getElementById('foot');
add(foot, [h('details', null, h('summary', {text: 'How this works'}), h('ul', null,
    h('li', {text: 'We track ' + S.length + ' halter stallions and what each has charged for a breeding. ' + PRICED.length + ' have a published price.'}),
    PM ? h('li', {text: 'The sale price comes from ' + PM.sales + ' young horses sold at public online auctions, by ' + PM.sires + ' stallions: ' + PM.weanlings + ' weanlings, ' +
      PM.yearlings + ' yearlings and ' + PM.two_year_olds + ' two-year-olds. Return is that price divided by the stud fee. It leaves out the cost of raising the foal.'}) : null,
    h('li', {text: 'A record is prize money won by a stallion’s foals in halter classes, from the public QData leaderboards for ' + SPAN + '. Strong record: in the top ten in at least one of those years. Some record: on the top-50 list.'}),
    h('li', {text: 'Chance of a prize winner ranks by what his foals won last year, moved up if that is rising and down if it is falling. We tried ten ways of ranking against past seasons and kept the best.'}),
    h('li', {text: 'It is a guide, not a guarantee. We cannot yet see how many foals each stallion has, so we cannot give one foal’s odds.'}))),
  h('p', null, h('a', {href: 'explore.html', text: 'See all the data behind this'}), D.repo ? ' · ' : null, D.repo ? h('a', {href: D.repo, text: 'Source'}) : null,
    ' · Updated ' + D.generated)]);
render();
})();
</script>
