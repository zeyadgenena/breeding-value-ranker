<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breeding Value Ranker: the data</title>
<meta name="description" content="Halter stallions: what a breeding costs, season by season, and a backtest of ranking them by foal quality per dollar.">
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --wash:rgba(11,11,11,.04);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --seq-lo:#cde2fb; --seq-hi:#0d366b;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --wash:rgba(255,255,255,.05);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --wash:rgba(255,255,255,.05);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{border-bottom:1px solid var(--border);background:var(--surface)}
.brand{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:18px 0 10px}
.brand h1{margin:0;font-size:20px;line-height:1.2}
.brand p{margin:2px 0 0;color:var(--ink2);font-size:14px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{background:var(--wash)}
.btn.small{padding:3px 9px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
main{padding:20px 0 48px}
h2{font-size:22px;line-height:1.25;margin:0 0 6px}
h3{font-size:16px;margin:0 0 2px}
.lede{color:var(--ink2);max-width:72ch;margin:0 0 18px}
.grid{display:grid;gap:16px}
.cols2{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.cols-even{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:900px){.cols2,.cols-even{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;min-width:0}
.card > .sub{color:var(--ink2);font-size:14px;margin:0 0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 16px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.tile .label{color:var(--ink2);font-size:13px}
.tile .value{font-size:26px;font-weight:600;line-height:1.2}
.tile .foot{color:var(--muted);font-size:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.filters input[type=search],.filters select{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
.filters input[type=search]{width:240px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;color:var(--ink2)}
.seg button + button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--grid);vertical-align:middle}
th{color:var(--ink2);font-weight:600;font-size:13px;white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.rowlink{cursor:pointer}
tbody tr.rowlink:hover{background:var(--wash)}
tbody tr[aria-selected="true"]{background:var(--wash);box-shadow:inset 3px 0 0 var(--s1)}
.name{font-weight:600}
.dim{color:var(--muted);font-size:12.5px}
.star{border:0;background:none;cursor:pointer;font-size:17px;line-height:1;padding:2px 4px;color:var(--muted)}
.star[aria-pressed="true"]{color:var(--s4)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2);margin:2px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.key-line{width:16px;height:0;border-top:2px solid currentColor;display:inline-block}
.key-dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:currentColor}
.key-tick{width:14px;height:0;border-top:3px solid var(--ink);display:inline-block}
.chart{position:relative;width:100%}
.chart svg{display:block;overflow:visible}
.chart svg text{font:12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--muted)}
.chart svg text.strong{fill:var(--ink);font-weight:600}
.chart svg text.label{fill:var(--ink2)}
.chart svg:focus{outline:2px solid var(--s1);outline-offset:2px;border-radius:6px}
details.tv{margin-top:10px}
details.tv summary{cursor:pointer;color:var(--ink2);font-size:13px}
details.tv .tablewrap{margin-top:8px;max-height:340px;overflow:auto}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.14);padding:8px 10px;font-size:13px;max-width:280px;display:none}
#tip .t{color:var(--ink2);margin-bottom:4px}
#tip .r{display:flex;align-items:center;gap:8px;justify-content:space-between}
#tip .r b{font-weight:600}
#tip .r span{color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.status{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.status svg{flex:none}
.banner{border:1px solid var(--border);border-left:4px solid var(--warn);background:var(--surface);border-radius:8px;padding:10px 12px;margin:0 0 14px;color:var(--ink2)}
.banner b{color:var(--ink)}
.checklist{list-style:none;margin:0;padding:0}
.checklist li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--grid)}
.checklist li:last-child{border-bottom:0}
.checklist small{display:block;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:999px;padding:4px 6px 4px 10px;background:var(--surface);font-size:13.5px}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:0 4px}
.empty{color:var(--ink2);padding:18px 4px}
.meta{color:var(--ink2);font-size:14px;margin:2px 0 10px}
.note{color:var(--ink2);font-size:13.5px;margin:10px 0 0}
.heat td,.heat th{text-align:center;border:0;padding:4px}
.heat td.cell{border-radius:8px;font-weight:600;font-size:16px;padding:16px 6px;min-width:56px}
.heat{table-layout:fixed}
.heat th.rowh{text-align:right;color:var(--ink2);font-weight:500;white-space:nowrap;padding-right:10px}
input[type=range]{width:220px;max-width:100%;accent-color:var(--s1)}
ol.steps{margin:6px 0 0;padding-left:20px;color:var(--ink2)}
ol.steps li{margin:4px 0}
ol.steps b{color:var(--ink)}
footer{border-top:1px solid var(--border);padding:16px 0 32px;color:var(--muted);font-size:13px}
</style>
</head>

function intervalChart(rows, base, label){
  return chartBox(function(box, W){
    var rh = 26, left = Math.min(190, Math.max(120, W * 0.3));
    var f = frame(box, W, rows.length * rh + 44, {t: 8, r: 20, b: 36, l: left}, label);
    var lo = Infinity, hi = -Infinity;
    rows.forEach(function(r){ lo = Math.min(lo, base + r.effect - 1.28 * r.se); hi = Math.max(hi, base + r.effect + 1.28 * r.se); });
    lo = Math.floor(Math.min(lo, base) - 1); hi = Math.ceil(Math.max(hi, base) + 1);
    var x = function(v){ return f.m.l + (v - lo) / (hi - lo) * f.iw; }, stp = Math.max(1, Math.round((hi - lo) / 5));
    for (var t = Math.ceil(lo); t <= hi; t += stp){
      s('line', {x1: x(t), x2: x(t), y1: f.m.t, y2: f.m.t + f.ih, stroke: cv('--grid'), 'stroke-width': 1}, f.svg);
      s('text', {x: x(t), y: f.m.t + f.ih + 16, 'text-anchor': 'middle', text: t}, f.svg);
    }
    s('line', {x1: x(base), x2: x(base), y1: f.m.t, y2: f.m.t + f.ih, stroke: cv('--axis'), 'stroke-width': 1.5}, f.svg);
    s('text', {x: x(base), y: f.H - 4, 'text-anchor': 'middle', class: 'label', text: 'average stallion: ' + num(base)}, f.svg);
    rows.forEach(function(r, i){
      var cy = f.m.t + rh * (i + 0.5), a = base + r.effect - 1.28 * r.se, b = base + r.effect + 1.28 * r.se;
      s('text', {x: f.m.l - 10, y: cy + 4, 'text-anchor': 'end', class: 'label', text: r.name.length > 24 ? r.name.slice(0, 23) + '…' : r.name}, f.svg);
      s('line', {x1: x(a), x2: x(b), y1: cy, y2: cy, stroke: cv('--s1'), 'stroke-width': 2, 'stroke-opacity': 0.45, 'stroke-linecap': 'round'}, f.svg);
      s('circle', {cx: x(base + r.effect), cy: cy, r: 4.5, fill: cv('--s1'), stroke: cv('--surface'), 'stroke-width': 2}, f.svg);
      var hit = s('rect', {x: 0, y: cy - rh / 2, width: W, height: rh, fill: 'transparent'}, f.svg);
      hit.addEventListener('pointermove', function(e){
        tip.show(e, r.name, [{color: cv('--s1'), dot: true, label: 'Expected foal score', value: num(base + r.effect)},
          {label: 'Likely range (80%)', value: num(a) + ' to ' + num(b)}, {label: 'Foals behind it', value: String(r.foals)},
          {label: 'Stud fee', value: money(r.fee)}, {label: 'Score points per $1,000', value: num(r.value, 2)}]);
      });

    });
  });
}
function truthChart(rows){
  return chartBox(function(box, W){
    var f = frame(box, W, 300, {t: 14, r: 16, b: 44, l: 56}, 'Estimated effect against the planted true effect');
    var xs = rows.map(function(r){ return r.truth; }), ys = rows.map(function(r){ return r.effect; });
    var xl = Math.max.apply(null, xs.map(Math.abs)) * 1.15 || 1, yl = Math.ceil(Math.max.apply(null, ys.map(Math.abs)) * 1.15) || 1;
    var x = function(v){ return f.m.l + (v + xl) / (2 * xl) * f.iw; }, y = function(v){ return f.m.t + f.ih - (v + yl) / (2 * yl) * f.ih; };
    [-yl, -yl / 2, 0, yl / 2, yl].forEach(function(t){
      s('line', {x1: f.m.l, x2: f.m.l + f.iw, y1: y(t), y2: y(t), stroke: cv(t === 0 ? '--axis' : '--grid'), 'stroke-width': 1}, f.svg);
      s('text', {x: f.m.l - 8, y: y(t) + 4, 'text-anchor': 'end', text: (t > 0 ? '+' : '') + num(t, 0)}, f.svg);
    });
    s('line', {x1: x(0), x2: x(0), y1: f.m.t, y2: f.m.t + f.ih, stroke: cv('--axis'), 'stroke-width': 1}, f.svg);
    s('text', {x: x(-xl) + 2, y: f.m.t + f.ih + 18, text: 'truly worse'}, f.svg);
    s('text', {x: x(xl) - 2, y: f.m.t + f.ih + 18, 'text-anchor': 'end', text: 'truly better'}, f.svg);
    s('text', {x: f.m.l + f.iw / 2, y: f.H - 4, 'text-anchor': 'middle', class: 'label', text: 'True effect planted in the made-up data'}, f.svg);
    var pts = rows.map(function(r){ return {x: x(r.truth), y: y(r.effect), r: r}; });
    pts.forEach(function(p){ s('circle', {cx: p.x, cy: p.y, r: 4, fill: cv('--s1'), 'fill-opacity': 0.7, stroke: cv('--surface'), 'stroke-width': 1.5}, f.svg); });
    nearestPoint(f, pts, function(q, e){
      tip.show(e, q.r.name, [{color: cv('--s1'), dot: true, label: 'Estimated effect', value: (q.r.effect > 0 ? '+' : '') + num(q.r.effect)},
        {label: 'Foals behind it', value: String(q.r.foals)}]);
    });
  });
}
function sparkline(st){
  var W = 96, H = 24, g = s('svg', {width: W, height: H, viewBox: '0 0 ' + W + ' ' + H, 'aria-hidden': 'true'});
  if (!st.seasons.length) return g;
  var vals = st.seasons.map(function(yv){ return st.listed[yv]; }), lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  var x = function(yv){ return 4 + (yv - minY) / Math.max(1, maxY - minY) * (W - 8); };
  var y = function(v){ return hi === lo ? H / 2 : H - 4 - (v - lo) / (hi - lo) * (H - 8); };
  var d = st.seasons.map(function(yv, i){ return (i ? 'L' : 'M') + x(yv).toFixed(1) + ' ' + y(st.listed[yv]).toFixed(1); }).join('');
  s('path', {d: d, fill: 'none', stroke: cv('--muted'), 'stroke-width': 1.5, 'stroke-linejoin': 'round'}, g);
  var last = st.seasons[st.seasons.length - 1];
  s('circle', {cx: x(last), cy: y(st.listed[last]), r: 2.5, fill: cv('--s1')}, g);
  return g;
}

        tableView(['Season', {t: 'Stallions', num: true}, {t: 'Lowest', num: true}, {t: 'Median', num: true}, {t: 'Highest', num: true}], med)),
      card('Auction bid against advertised fee', pairs.length + ' breedings sold at auction. ' + under + ' went for less than the advertised fee; the median was ' + pct(share) + ' of it.',
        scatterChart(pairs),
        tableView(['Stallion', 'Season', {t: 'Advertised', num: true}, {t: 'Winning bid', num: true}, {t: 'Share', num: true}],
          pairs.slice().sort(function(a, b){ return a.bid / a.fee - b.bid / b.fee; }).map(function(p){ return [p.st.name, p.y, money(p.fee), money(p.bid), pct(p.bid / p.fee)]; }))))
  ];
}

var GROUPS = [['Top value picks', '--s1'], ['Cheap but average', '--s2'], ['Random, similar fee (median)', '--s3']];
function viewBacktest(){
  var sets = [{key: 'real', title: 'Your data', res: D.real}].concat(D.synthetic.map(function(x){ return {key: x.key, title: 'Made-up: ' + x.title, res: x}; }));
  var cur = sets.filter(function(x){ return x.key === state.dataset; })[0] || sets[0], R = cur.res, synth = cur.key !== 'real';
  var sel = h('select', {'aria-label': 'Dataset', onchange: function(e){ state.dataset = e.target.value; render(); }},
    sets.map(function(x){ return h('option', {value: x.key, selected: x.key === cur.key, text: x.title}); }));
  var out = [h('h2', {text: 'Backtest'}),
    h('p', {class: 'lede', text: 'Would ranking stallions by foal quality per dollar have worked? For each past year the ranking uses only what was known then, and is judged on the foals born two and three years later.'}),
    h('div', {class: 'filters'}, h('label', {for: 'ds', text: 'Dataset'}), sel)];
  sel.id = 'ds';
  if (synth) out.push(h('div', {class: 'banner'}, h('b', {text: 'Made-up horses. '}), R.blurb + ' ' + R.counts.stallions + ' stallions, ' + R.counts.foals.toLocaleString('en-US') + ' foals.'));
  var usable = R.windows.filter(function(w){ return w.groups['Top value picks']; });
  if (!usable.length){
    out.push(card('No verdict yet', null,
      h('p', {class: 'status'}, statusIcon('todo'), 'Not enough data'),
      h('p', {class: 'lede', style: 'margin-top:8px', text: 'The workbook has ' + R.counts.stallions + ' stallions with fees and ' + R.counts.foals + ' foals. The backtest needs foal show records for at least three time windows. Choose one of the made-up datasets above to see what the result will look like.'})));
    return out;
  }
  var v = R.verdict, kind = v.status === 'PASS' ? 'good' : v.status === 'FAIL' ? 'bad' : 'todo';
  var key = R.primary === 'adj' || R.primary === 'fwd_adj' ? 'adj' : 'score';
  var cats = usable.map(function(w){ return w.asof; });
  var series = GROUPS.map(function(g){
    var vals = {}; usable.forEach(function(w){ if (w.groups[g[0]]) vals[w.asof] = w.groups[g[0]][key]; });
    return {name: g[0].replace(' (median)', ''), color: cv(g[1]), vals: vals};
  });
  out.push(h('div', {class: 'tiles'},
    h('div', {class: 'tile'}, h('div', {class: 'label', text: 'Verdict'}), h('div', {class: 'value status'}, statusIcon(kind), v.status === 'PASS' ? 'Pass' : v.status === 'FAIL' ? 'Fail' : 'No verdict'),
      h('div', {class: 'foot', text: usable.length + ' time windows'})),
    tile('Against same-price picks', v.pct == null ? 'n/a' : num(v.pct, 0) + 'th', 'percentile on average; the bar is ' + num(v.bar, 0)),
    tile('Beat cheap-but-average', v.wins_cheap + ' of ' + usable.length, 'windows'),
    tile('Dam adjustment', R.model.mare_active ? 'On' : 'Off', R.model.mare_active ? 'each dam point is worth ' + num(R.model.slope, 2) : 'too little dam data')));
  if (cur.key === 'planted' && v.status === 'FAIL')
    out.push(h('div', {class: 'banner'}, h('b', {text: 'A near miss, and a useful one. '}),
      'The effect in this made-up world is real, yet this run fell just short of the bar. With this much data the test misses a real effect about 1 time in 5. The Sample size tab shows why.'));
  out.push(h('div', {class: 'grid cols-even'},
    card('How the picks’ foals turned out', 'Average later foal score' + (key === 'adj' ? ', adjusted for the dam' : '') + '. 50 is a typical foal.',
      legend(series.map(function(se){ return {label: se.name, color: se.color}; })),
      multiLine({cats: cats, series: series, fmt: function(x){ return num(x); }, zero: false, endLabels: W_WIDE(), height: 280, label: 'Later foal score by group and as-of year',
        title: function(c){ var w = usable.filter(function(q){ return q.asof === c; })[0]; return 'Ranked in ' + c + ', foals born ' + w.crops; }}),
      tableView(['Ranked in', 'Foals born', {t: 'Pool', num: true}, {t: 'Top picks', num: true}, {t: 'Cheap but average', num: true}, {t: 'Random, similar fee', num: true}, {t: 'Picks beat', num: true}],
        usable.map(function(w){ return [w.asof, w.crops, w.pool, num(w.groups['Top value picks'][key]), num(w.groups['Cheap but average'][key]),
          num(w.groups['Random, similar fee (median)'][key]), w.pct == null ? '' : num(w.pct, 0) + '%']; }))),
    card('What the verdict means', null,
      h('p', {class: 'lede', text: v.why}),
      h('ol', {class: 'steps'},
        h('li', null, h('b', {text: 'Top value picks'}), ' are the top quarter of stallions by estimated foal quality per $1,000 of stud fee.'),
        h('li', null, h('b', {text: 'Cheap but average'}), ' are stallions at or below the median fee with a middling estimate.'),
        h('li', null, h('b', {text: 'Random, similar fee'}), ' is the median of 2,000 random picks at about the same price as each top pick.'),
        h('li', null, 'A pass needs the picks to beat cheap-but-average in more than half the windows and to stand high enough against same-price picks that luck would do it about 1 time in 20.')))));

  /* ranking with a pairing slider */
  var top = R.ranking.slice(0, 15);
  if (top.length){
    var base = R.model.grand_mean + R.model.slope * (state.mare - R.model.mare_mean);
    var slider = h('input', {type: 'range', min: 0, max: 100, step: 1, value: state.mare, id: 'mare', 'aria-label': 'Quality of your mare, 0 to 100',
      oninput: function(e){ state.mare = Number(e.target.value); render(); var el = document.getElementById('mare'); if (el) el.focus(); }});
    out.push(h('div', {style: 'height:16px'}));
    out.push(card('Try a pairing', 'Expected foal score for each of today’s top ' + top.length + ' stallions by value, bred to a mare of the quality you set. The line is the likely range.',
      h('div', {class: 'filters'}, h('label', {for: 'mare', text: 'Your mare’s quality'}), slider, h('b', {text: String(state.mare)}),
        h('span', {class: 'dim', text: '50 is a typical mare. She shifts every stallion by the same amount, so she moves the level, not the order.'})),
      intervalChart(top, base, 'Expected foal score by stallion'),
      tableView(['Rank', 'Stallion', {t: 'Fee', num: true}, {t: 'Foals', num: true}, {t: 'Expected score', num: true}, {t: 'Low', num: true}, {t: 'High', num: true}, {t: 'Per $1,000', num: true}],
        R.ranking.map(function(r){ return [r.rank, r.name, money(r.fee), r.foals, num(base + r.effect), num(base + r.effect - 1.28 * r.se), num(base + r.effect + 1.28 * r.se), num(r.value, 2)]; }),
        'Show all ' + R.ranking.length + ' ranked stallions')));
  }
  var withTruth = R.ranking.filter(function(r){ return r.truth != null; });
  if (synth && withTruth.some(function(r){ return r.truth !== 0; })){
    out.push(h('div', {style: 'height:16px'}));
    out.push(card('Does the estimate find the truth?', 'Each dot is a made-up stallion. Dots rising from lower left to upper right mean the method recovered the effect that was planted. Correlation across all stallions: ' + num(R.model.truth_corr, 2) + '.',
      truthChart(withTruth),
      tableView(['Stallion', {t: 'Planted effect', num: true}, {t: 'Estimated effect', num: true}, {t: 'Foals', num: true}],
        withTruth.map(function(r){ return [r.name, num(r.truth, 2), num(r.effect), r.foals]; }))));
  }
  return out;
}

function viewSample(){
  var P = D.power;
  if (!P) return [h('h2', {text: 'Sample size'}), h('p', {class: 'lede', text: 'No simulation results in this build.'})];
  function shade(v){
    var t = v / 100, mix = Math.round(t * 100);
    return 'background:color-mix(in srgb, var(--seq-hi) ' + mix + '%, var(--seq-lo));color:' + (t > 0.45 ? '#fff' : '#0b0b0b');
  }
  var t = h('table', {class: 'heat'}), hr = h('tr', null, h('th'));
  P.foals.forEach(function(n){ hr.appendChild(h('th', {text: n + ' foals'})); });
  t.appendChild(h('thead', null, hr));
  var tb = h('tbody');
  P.planted.forEach(function(row){
    var tr = h('tr', null, h('th', {class: 'rowh', text: 'Sire ' + row.share + '%'}));
    row.pass.forEach(function(v){ tr.appendChild(h('td', {class: 'cell', style: shade(v), text: v + '%'})); });
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  return [
    h('h2', {text: 'How much data the backtest needs'}),
    h('p', {class: 'lede', text: 'Before trusting a verdict, ask how often the test gets it right. These figures come from running the whole backtest on 100 made-up datasets per cell, with about 40 stallions each.'}),
    h('div', {class: 'grid cols-even'},
      card('When underpriced stallions really exist', 'How often the backtest passes. Columns are scored foals per stallion. Rows are the share of foal quality that comes from the sire. Darker is better.',
        h('div', {class: 'tablewrap'}, t),
        h('p', {class: 'note', text: 'A trait with heritability near 0.3 puts the sire at about 8%. Show points are a noisy stand-in, so the real figure is probably at or below that. Aim for roughly 100 scored foals per stallion.'})),
      card('When there is nothing to find', 'How often the backtest passes anyway. Lower is better.',
        (function(){ var tv = tableView(['Made-up world'].concat(P.foals.slice(1).map(function(n){ return {t: n + ' foals', num: true}; })),
          P.nulls.map(function(r){ return [r.world].concat(r.pass.slice(1).map(function(v){ return v + '%'; })); })); tv.open = true; tv.querySelector('summary').textContent = 'False passes'; return tv; })(),
        h('p', {class: 'note', text: 'Better mares going to pricier stallions is the real threat. The dam adjustment removes only part of it, and more data makes the false signal easier to detect, not harder.'})))
  ];
}

function viewAbout(){
  var links = D.repo ? h('p', {class: 'note'}, 'Full write-up: ', h('a', {href: D.repo + '/blob/main/FINDINGS.md', text: 'findings and decision note'}), ' · ',
    h('a', {href: D.repo + '#readme', text: 'how to run it'}), ' · ', h('a', {href: D.repo, text: 'source'})) : null;
  return [
    h('h2', {text: 'About this page'}),
    h('p', {class: 'lede', text: 'A personal research tool. It asks whether some halter stallions are underpriced for the foals they sire, and tests the idea on past data before trusting it.'}),
    h('div', {class: 'grid cols-even'},
      card('How the ranking works', null, h('ol', {class: 'steps'},
        h('li', null, h('b', {text: 'Link. '}), 'Each foal is matched to its sire and dam by registration number.'),
        h('li', null, h('b', {text: 'Score. '}), 'Halter points become a 0 to 100 percentile within the foal’s own crop year. Unshown foals count as zero.'),
        h('li', null, h('b', {text: 'Effect. '}), 'How far a stallion’s foals sit above what their crop and their dams predict, shrunk toward zero when he has few foals.'),
        h('li', null, h('b', {text: 'Value. '}), 'Effect divided by stud fee, per $1,000. A below-average stallion is never good value.'),
        h('li', null, h('b', {text: 'Backtest. '}), 'Rank with data through one year, pay the next season’s fee, judge the foals born two and three years on.')), links),
      card('Where the prices come from', null,
        h('p', {class: 'lede', text: 'Advertised fees and winning bids come from public stallion-service auction pages, archived copies of the QStallions directory and each stallion’s own directory page. Every figure links to its source in the fee table on the Stallions tab.'}),
        h('p', {class: 'note', text: 'Sources disagree on whether a fee includes the chute or booking fee. Registration numbers on auction pages are typed by consignors, so check them before ordering records. The stallions here are those offered at a futurity auction in at least three seasons, plus seven from the directory; they are not a random sample.'}),
        h('p', {class: 'note', text: 'Foal show records are not public per foal. They come from AQHA through a member login and are not in this page yet.'})))
  ];
}

/* ---------- render ---------- */
var VIEWS = {overview: viewOverview, stallions: viewStallions, shortlist: viewShortlist, market: viewMarket, backtest: viewBacktest, sample: viewSample, about: viewAbout};
function render(){
  tip.hide();
  var nav = document.getElementById('tabs');
  nav.replaceChildren();
  TABS.forEach(function(t){
    var label = t[1] + (t[0] === 'shortlist' && state.shortlist.length ? ' (' + state.shortlist.length + ')' : '');
    nav.appendChild(h('button', {type: 'button', role: 'tab', 'aria-selected': state.tab === t[0] ? 'true' : 'false', text: label, onclick: function(){ go(t[0]); }}));
  });
  var list = document.getElementById('list'), keep = list ? list.scrollTop : 0;
  app.replaceChildren();
  add(app, VIEWS[state.tab]());
  list = document.getElementById('list');
  if (list) list.scrollTop = keep;
  drawAll();
}
var foot = document.getElementById('foot');
foot.textContent = 'Built ' + D.generated + ' from ' + D.source + '. ' + D.stallions.length + ' stallions. Personal research, not advice. ';
if (D.repo) foot.appendChild(h('a', {href: D.repo, text: 'Source on GitHub'}));

var themeBtn = document.getElementById('theme');
function isDark(){
  var t = document.documentElement.getAttribute('data-theme');
  return t ? t === 'dark' : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function paintTheme(){ themeBtn.textContent = isDark() ? 'Light' : 'Dark'; }
var saved = store('bvr.theme'); if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
themeBtn.addEventListener('click', function(){ var next = isDark() ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', next); store('bvr.theme', next); paintTheme(); });
paintTheme();
if (window.matchMedia) try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintTheme); } catch (e) {}

var fromHash = (location.hash || '').slice(1);
if (VIEWS[fromHash]) state.tab = fromHash;
try { var want = new URLSearchParams(location.search).get('s'); if (want && byId[want]){ state.selected = want; if (!VIEWS[fromHash]) state.tab = 'stallions'; } } catch (e) {}
window.addEventListener('hashchange', function(){ var t = location.hash.slice(1); if (VIEWS[t] && t !== state.tab){ state.tab = t; render(); } });
var rz; window.addEventListener('resize', function(){ clearTimeout(rz); rz = setTimeout(drawAll, 120); });
render();
})();
</script>
