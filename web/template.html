<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breeding Value Ranker</title>
<meta name="description" content="Tell us what you have and what you can spend. We rank every halter stallion in your budget by the return you can expect.">
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --line:rgba(11,11,11,.12); --wash:rgba(11,11,11,.04); --accent:#2a78d6; --good:#0ca30c;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --line:rgba(255,255,255,.14); --wash:rgba(255,255,255,.06); --accent:#3987e5;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:28px 16px 56px}
h1{font-size:30px;line-height:1.15;margin:0 0 6px}
.tag{color:var(--ink2);margin:0 0 30px;font-size:18px}
h2{font-size:20px;margin:30px 0 12px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
@media (max-width:560px){.choices{grid-template-columns:minmax(0,1fr)}}
.choice{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;cursor:pointer}
.choice b{display:block;font-size:18px}
.choice span{color:var(--ink2);font-size:14.5px}
.choice:hover{background:var(--wash)}
.choice[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.money{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 16px;max-width:260px}
.money:focus-within{border-color:var(--ink)}
.money span{font-size:26px;color:var(--muted)}
.money input{border:0;outline:0;background:none;font-size:26px;font-weight:600;width:100%;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:15px}
.chip:hover{background:var(--wash)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.field{margin:18px 0 0}
.field label,.field .lab{display:block;font-weight:600;margin:0 0 6px}
.field small{display:block;color:var(--ink2);margin:6px 0 0;font-size:14.5px}
.field input[type=text],.field select{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;width:100%;max-width:360px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1.5px solid var(--line);border-radius:12px;overflow:hidden;max-width:520px}
.seg button{border:0;background:var(--surface);padding:10px 14px;cursor:pointer;color:var(--ink2);text-align:left}
.seg button + button{border-left:1px solid var(--line)}
@media (max-width:560px){.seg{grid-template-columns:minmax(0,1fr)}.seg button + button{border-left:0;border-top:1px solid var(--line)}}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.card{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:18px 20px;margin:0 0 12px}
.card.best{border:2px solid var(--ink)}
.eyebrow{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);font-weight:600;margin:0 0 4px}
.name{font-size:24px;font-weight:700;line-height:1.2;margin:0}
.by{color:var(--ink2);font-size:14.5px;margin:2px 0 10px}
.row{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;margin:0 0 8px}
.price{font-size:20px;font-weight:700}
.price small{font-size:14.5px;font-weight:400;color:var(--ink2);margin-left:6px}
.badge{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14.5px;white-space:nowrap}
.badge i{width:11px;height:11px;border-radius:50%;display:inline-block;border:2px solid var(--muted)}
.badge.strong i{background:var(--good);border-color:var(--good)}
.badge.some i{background:var(--muted)}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
.nums.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:560px){.nums,.nums.two{grid-template-columns:minmax(0,1fr)}}
.num{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.num .k{display:block;color:var(--ink2);font-size:13.5px}
.num .v{display:block;font-size:24px;font-weight:700;line-height:1.25}
.num .s{display:block;color:var(--ink2);font-size:13px}
.why{margin:0 0 8px;color:var(--ink)}
.fine{color:var(--ink2);font-size:14.5px;margin:6px 0 0}
.note{border-left:4px solid var(--accent);background:var(--surface);border-radius:8px;padding:12px 14px;margin:14px 0;color:var(--ink2)}
.note b{color:var(--ink)}
.linkbtn{border:0;background:none;padding:0;text-decoration:underline;cursor:pointer;color:inherit}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
th{color:var(--ink2);font-weight:600;font-size:13px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.n{white-space:nowrap}
td .sub{display:block;color:var(--ink2);font-size:13px;font-weight:400}
td .badge{font-size:13px;font-weight:400;white-space:normal}
td .badge i{flex:none}
tr.top td{background:var(--wash);font-weight:600}
@media (max-width:560px){th.wide,td.wide{display:none}th,td{padding:9px 6px}th:first-child,td:first-child{padding-left:10px}th:last-child,td:last-child{padding-right:10px}table{font-size:14.5px}th{font-size:12.5px}}
details{margin:14px 0 0}
summary{cursor:pointer;font-weight:600}
ul.plain{margin:6px 0 0;padding-left:20px}
ul.plain li{margin:8px 0}
footer{margin:40px 0 0;padding:18px 0 0;border-top:1px solid var(--line);color:var(--ink2);font-size:15px}
footer ul{margin:10px 0 0;padding-left:20px}
footer li{margin:6px 0}
</style>
</head>
<body>
<main class="wrap">
  <h1>Breeding Value Ranker</h1>
  <p class="tag">Tell us what you have and what you can spend. We rank every halter stallion in your budget by the return you can expect.</p>
  <div id="app"></div>
  <footer id="foot"></footer>
</main>
<script>/*__BVR_DATA__*/</script>
<script>
(function(){
'use strict';
var D = window.BVR, B = D.breeds || {qh: D.match}, KEYS = Object.keys(B), app = document.getElementById('app');
var M, S, PM, MARES, PRICED, LOWEST;
var state = {breed: null, have: null, budget: null, sire: '', total: null, mine: '', goal: 'win', all: false, proven: false};

function h(tag, attrs){
  var el = document.createElement(tag), k, i;
  attrs = attrs || {};
  for (k in attrs){
    if (attrs[k] == null || attrs[k] === false) continue;
    if (k === 'text') el.textContent = attrs[k];
    else if (k === 'class') el.className = attrs[k];
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), attrs[k]);
    else el.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
  }
  for (i = 2; i < arguments.length; i++) add(el, arguments[i]);
  return el;
}
function add(el, kid){
  if (kid == null || kid === false) return;
  if (Array.isArray(kid)) { kid.forEach(function(k){ add(el, k); }); return; }
  el.appendChild(typeof kid === 'string' || typeof kid === 'number' ? document.createTextNode(String(kid)) : kid);
}
function money(v){ return '$' + Math.round(v).toLocaleString('en-US'); }
function times(v){ return (Math.round(v * 10) / 10).toFixed(1) + 'x'; }
function pct(v){ return v > 0 && v < 0.01 ? 'under 1%' : Math.round(v * 100) + '%'; }
function ordinal(n){ var s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function norm(s){ return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
function priced(s){ return !!(s.sale && s.sale.tested); }
function use(b){
  state.breed = b; M = B[b]; S = M.stallions; PM = M.pricing; MARES = M.sales && M.sales.mares;
  PRICED = S.filter(function(s){ return s.price; });
  LOWEST = PRICED.reduce(function(m, s){ return Math.min(m, s.price.fee); }, Infinity);
  state.goal = 'win'; state.all = false; state.mine = ''; state.sire = ''; state.proven = false;
}
function chance(st){ return st.odds ? (state.proven ? st.odds.yes : st.odds.no) : null; }
function moneyChance(st){ return st.odds ? (state.proven ? st.odds.money_yes : st.odds.money_no) : null; }

/* ---------- two ways to rank ---------- */
function byWinner(list){            // by foal record: the rule tested against past seasons
  return list.slice().sort(function(a, b){ return b.score - a.score || a.price.fee - b.price.fee || (a.name < b.name ? -1 : 1); });
}
function byReturn(list){            // likely sale price as a yearling, divided by the stud fee
  return list.filter(priced).sort(function(a, b){
    return b.sale.multiple - a.sale.multiple || b.score - a.score || (a.name < b.name ? -1 : 1);
  });
}
function unpriced(list){ return byWinner(list.filter(function(s){ return !priced(s); })); }

/* ---------- pieces ---------- */
function badge(st){
  var t = st.rec.tier;
  return h('span', {class: 'badge ' + t}, h('i'), t === 'strong' ? 'Strong record' : t === 'some' ? 'Some record' : 'No foal results yet');
}
function feeLine(st){
  var p = st.price;
  return h('span', {class: 'price'}, money(p.fee),
    h('small', {text: p.basis === 'auction' ? 'what a breeding sold for at auction, ' + p.year : p.current ? 'stud fee, ' + p.year : 'last advertised fee, ' + p.year}));
}
function byLine(st){
  return h('p', {class: 'by', text: [st.sire ? 'by ' + st.sire : null, st.foaled ? 'foaled ' + st.foaled : null].filter(Boolean).join(' · ')});
}
function num(k, v, s){
  return h('div', {class: 'num'}, h('span', {class: 'k', text: k}), h('span', {class: 'v', text: v}), s ? h('span', {class: 's', text: s}) : null);
}
function saleNums(st){
  var x = st.sale;
  return [h('div', {class: 'nums'},
      num('Sold as a weanling', money(x.weanling), times(x.weanling_multiple) + ' the fee, about 18 months after breeding'),
      num('Sold as a yearling', money(x.typical), times(x.multiple) + ' the fee, about 2 years after breeding'),
      num('Chance of 3x the fee', pct(x.p3), 'a yearling at ' + money(3 * st.price.fee) + ' or more')),
    h('p', {class: 'fine', text: 'Half of yearlings like his sell between ' + money(x.low) + ' and ' + money(x.high) + '. The chance of ten times the fee is ' + pct(x.p10) + '.'}),
    h('p', {class: 'fine', text: 'One year after breeding the foal has only just been born, because a mare carries for about 11 months. Foals are first sold as weanlings, then as yearlings.'}),
    x.real ? h('p', {class: 'fine', text: 'What actually happened: ' + x.real.n + ' young horses whose sire stood for ' + x.real.label + ' sold for a typical ' + money(x.real.median) +
      ', which was ' + times(x.real.multiple) + ' the fee.' + (x.real.median < x.typical ? ' That counts geldings and older sales, which pulls it below the estimate.' : '')}) : null];
}
function prizeNums(st){
  if (st.odds) return [h('div', {class: 'nums'},
      num('Chance of a top-three finish', pct(chance(st)), 'at the futurity, if the foal is shown'),
      num('Chance of a ' + money(M.foal.money_at) + ' year', pct(moneyChance(st)), 'one of the year\u2019s top 50 money earners'),
      num('Sire rank last year', st.rank ? ordinal(st.rank) : 'not listed', st.hits + (st.hits === 1 ? ' foal' : ' foals') + ' in the top 50 earners')),
    M.foal && !state.proven && state.have !== 'stallion' ? h('p', {class: 'fine', text: 'With a mare that has already produced an earner, the chance of a top-three finish rises to ' + pct(st.odds.yes) + '.'}) : null,
    st.fut ? h('p', {class: 'fine', text: 'At the futurity in ' + M.foal.years[0] + ' to ' + M.foal.years[M.foal.years.length - 1] + ', ' + st.fut.shown + ' of his foals were shown. ' +
      st.fut.top3 + ' of their ' + st.fut.starts + ' starts ended in the top three of an open class, and ' + st.fut.wins + ' in a win.'}) : null];
  return st.tiles && st.tiles.length ? h('div', {class: 'nums'}, st.tiles.map(function(t){ return num(t[0], t[1], t[2]); })) : null;
}
function extras(st){
  return [
    st.shown ? h('p', {class: 'fine', text: 'Of his ' + st.shown.n + ' foals shown in ' + st.shown.y + ', ' + st.shown.big + (st.shown.big === 1 ? ' has' : ' have') + ' won $20,000 or more so far.'}) : null,
    st.sold ? h('p', {class: 'fine', text: st.sold.n + ' of his young foals are in the public sales. Their typical price was ' + money(st.sold.median) + '.'}) : null,
    st.note ? h('p', {class: 'fine', text: st.note}) : null,
    M.detail ? h('p', {class: 'fine'}, h('a', {href: M.detail + '?s=' + encodeURIComponent(st.id) + '#stallions', text: 'More about him'})) : null];
}
function whyReturn(top, ranked, pool){
  var out = [], t;
  if (ranked.length === 1) t = 'He is the only stallion in your budget whose foals we can price.';
  else {
    var prices = ranked.map(function(s){ return s.sale.typical; }), lo = Math.min.apply(null, prices), hi = Math.max.apply(null, prices);
    t = 'At public auction a yearling’s price barely depends on his sire. ' +
      (lo === hi ? 'Every stallion in your budget comes out at about ' + money(lo) : 'Every stallion in your budget comes out between ' + money(lo) + ' and ' + money(hi)) +
      '. So the stud fee decides the return, and ' +
      (ranked.every(function(s){ return s.price.fee >= top.price.fee; }) ? 'his is the lowest we can price.' : 'his is among the lowest.');
    var same = ranked.filter(function(s){ return s.price.fee === top.price.fee && s.id !== top.id; }).length;
    if (same) t += ' ' + same + (same === 1 ? ' other costs' : ' others cost') + ' the same. ' +
      (top.rec.active ? 'He is first because his foals’ winnings are the strongest of that group.' : 'None of them had foals on last year’s list, so they are level.');
  }
  out.push(h('p', {class: 'why', text: t}));
  var star = byWinner(pool)[0];
  if (star && star.id !== top.id && priced(star)){
    var more = star.sale.typical - top.sale.typical, dearer = star.price.fee - top.price.fee;
    out.push(h('p', {class: 'why', text: 'The strongest record in your budget is ' + star.name + ' at ' + money(star.price.fee) + '. His yearling is likely to sell for ' +
      money(star.sale.typical) + (more > 0 ? ', ' + money(more) + ' more' : ', no more') + (dearer > 0 ? ', for a fee ' + money(dearer) + ' higher' : '') +
      '. That is a return of ' + times(star.sale.multiple) + '. His record buys a better chance of a prize winner, not a higher auction price.'}));
  }
  return out;
}
function whyWinner(top, ranked){
  if (ranked.length === 1) return 'He is the only stallion in your budget.';
  var next = ranked[1], t;
  if (top.rank)
    t = 'His foals won more in halter last year than those of any other stallion in your budget' + (next.rank ? ' (next is ' + next.name + ')' : '') +
      '. He stood ' + ordinal(top.rank) + ' among all halter sires. Tested on past seasons, last year\u2019s winnings were as good a guide as anything we tried.';
  else if (top.hits != null) t = 'No stallion in your budget was among last year\u2019s top 50 halter sires, so they are level on record. He is listed first by price.';
  else t = 'He has the strongest foal record of the ' + ranked.length + ' stallions in your budget.';
  return t;
}
function returnCard(top, ranked, pool, split){
  return h('article', {class: 'card best'},
    h('p', {class: 'name', text: top.name}), byLine(top),
    h('div', {class: 'row'}, feeLine(top), badge(top)),
    split, saleNums(top),
    h('p', {class: 'eyebrow', style: 'margin-top:14px', text: 'Why he ranks first'}),
    whyReturn(top, ranked, pool),
    h('p', {class: 'fine', text: top.rec.text}),
    extras(top));
}
function winnerCard(st, label, split, ranked){
  return h('article', {class: 'card best'},
    label ? h('p', {class: 'eyebrow', text: label}) : null,
    h('p', {class: 'name', text: st.name}), byLine(st),
    h('div', {class: 'row'}, feeLine(st), badge(st)),
    split, prizeNums(st),
    ranked ? [h('p', {class: 'eyebrow', style: 'margin-top:14px', text: 'Why he ranks first'}), h('p', {class: 'why', text: whyWinner(st, ranked)})] : null,
    h('p', {class: ranked ? 'fine' : 'why', text: st.rec.text}),
    priced(st) ? h('p', {class: 'fine', text: 'If you sell the foal instead of showing it: likely ' + money(st.sale.typical) + ' as a yearling, a return of ' + times(st.sale.multiple) + ' on the fee.'}) : null,
    extras(st));
}
function rankTable(ranked, cols, starId){
  var rows = ranked.map(function(s, i){ return {s: s, i: i}; });
  var cut = !state.all && rows.length > 12;
  var vis = cut ? rows.filter(function(r){ return r.i < 10 || r.s.id === starId; }) : rows;
  cols = cols.filter(Boolean);
  return [h('div', {class: 'tablewrap'}, h('table', null,
      h('thead', null, h('tr', null, h('th', {text: '#'}), h('th', {text: 'Stallion'}), cols.map(function(c){ return h('th', {class: 'n' + (c[2] ? ' ' + c[2] : ''), text: c[0]}); }))),
      h('tbody', null, vis.map(function(r){
        return h('tr', {class: r.i === 0 ? 'top' : null}, h('td', {text: String(r.i + 1)}),
          h('td', null, r.s.name, h('span', {class: 'sub'}, badge(r.s)),
            r.s.id === starId && r.i > 0 ? h('span', {class: 'sub', text: 'Strongest record in your budget'}) : null),
          cols.map(function(c){ return h('td', {class: 'n' + (c[2] ? ' ' + c[2] : ''), text: c[1](r.s)}); }));
      })))),
    cut ? h('p', {class: 'fine'}, h('button', {class: 'linkbtn', type: 'button', text: 'Show all ' + rows.length,
      onclick: function(){ state.all = true; results(); }})) : null];
}
var COL = {
  fee: ['Stud fee', function(s){ return money(s.price.fee); }],
  sale: ['Yearling sells for', function(s){ return priced(s) ? money(s.sale.typical) : 'no estimate'; }],
  ret: ['Return', function(s){ return priced(s) ? times(s.sale.multiple) : 'no estimate'; }]
};
function statCol(){
  return M.foal ? ['Top three', function(s){ return s.odds ? pct(chance(s)) : ''; }] : [M.stat_label || 'Record', function(s){ return s.stat || ''; }];
}
function moneyInput(id, value, onset, label){
  var input = h('input', {id: id, type: 'text', inputmode: 'numeric', autocomplete: 'off', placeholder: '0', 'aria-label': label,
    value: value == null ? '' : Math.round(value).toLocaleString('en-US')});
  input.addEventListener('input', function(){
    var n = parseInt(input.value.replace(/[^0-9]/g, ''), 10);
    onset(isNaN(n) ? null : n, true);
  });
  return h('div', {class: 'money'}, h('span', {text: '$'}), input);
}
function chips(values, current, onpick){
  return h('div', {class: 'chips'}, values.map(function(v){
    return h('button', {type: 'button', class: 'chip', 'aria-pressed': current === v ? 'true' : 'false', text: money(v), onclick: function(){ onpick(v); }});
  }));
}
function seg(label, options, current, onpick){
  return h('div', {class: 'field'}, h('span', {class: 'lab', text: label}),
    h('div', {class: 'seg', role: 'group', 'aria-label': label}, options.map(function(o){
      return h('button', {type: 'button', 'aria-pressed': current === o[0] ? 'true' : 'false', text: o[1], onclick: function(){ onpick(o[0]); }});
    })));
}
function goalToggle(){
  if (!PM) return null;
  return seg('Rank by', [['win', 'Chance of a prize winner'], ['sell', 'Return if I sell the foal']], state.goal, function(g){ state.goal = g; state.all = false; results(); });
}
function provenToggle(){
  if (!M.foal) return null;
  return [seg('Has she produced a foal that won ' + money(M.foal.proven_at) + ' or more in halter in one year?', [[true, 'Yes'], [false, 'No, or not yet']], state.proven,
    function(p){ state.proven = p; results(); }), h('p', {class: 'fine', text: 'It matters as much as the stallion. Foals of mares like that finished in the top three ' +
      pct(M.foal.proven_rate) + ' of the time, against ' + pct(M.foal.other_rate) + ' for other mares.'})];
}
function cardTable(rows, kept){
  return h('div', {class: 'tablewrap', style: 'margin-top:10px'}, h('table', null,
    h('thead', null, h('tr', null, h('th', {text: 'Version'}), rows.head.map(function(t){ return h('th', {class: 'n', text: t}); }))),
    h('tbody', null, rows.body.map(function(r){ return h('tr', {class: r.kept ? 'top' : null}, h('td', {text: r.name}), r.cells.map(function(c){ return h('td', {class: 'n', text: c}); })); }))));
}
function priceCard(){
  if (!PM || !PM.scorecard) return null;
  return h('details', null, h('summary', {text: 'See all ' + PM.scorecard.length + ' versions of the price model'}),
    h('p', {class: 'fine', text: 'Each version was trained with one auction left out, then scored on that auction, for every auction in turn.'}),
    cardTable({head: ['Typical miss', 'Price differences explained'], body: PM.scorecard.map(function(r){
      var e = Math.round(r.explained * 100);
      return {name: r.name, kept: r.kept, cells: [Math.round(r.typical_miss * 100) + '%', e > 0 ? e + '%' : 'none']};
    })}));
}
function foalCard(){
  var F = M.foal;
  if (!F || !F.scorecard) return null;
  return h('details', null, h('summary', {text: 'See all ' + F.scorecard.length + ' versions of the foal model'}),
    h('p', {class: 'fine', text: 'The score is how well a version sorts foals it has not seen: 0.50 is a coin toss, 1.00 is perfect. "Forward" trains on the earlier years and tests on ' +
      F.years[F.years.length - 1] + '. "Each year" holds every year out in turn.'}),
    cardTable({head: ['Forward', 'Each year'], body: F.scorecard.map(function(r){ return {name: r.name, kept: r.kept, cells: [r.forward.toFixed(2), r.each_year.toFixed(2)]}; })}));
}
function expectBox(budget){
  var items = [], R = M.record, F = M.foal;
  if (PM && state.goal === 'sell'){
    items.push(h('li', null, 'The sale prices are rough. We trained ' + PM.rounds + ' versions of a price model on ' + PM.sales + ' public sales and tried ' + PM.combinations +
      ' combinations of factors. The best explains about ' + Math.round(PM.explained * 100) + '% of the difference between one sale and the next, and nearly all of that is the horse’s age, sex and the year it sold, not its sire. Two sales in three landed between half and double its estimate.',
      priceCard()));
    items.push(h('li', {text: 'They are public online auction prices. The best halter prospects usually change hands privately, at prices nobody publishes, so a top sire’s best foals can be worth more than this shows.'}));
    items.push(h('li', {text: 'A big resale is rare. Of the ' + PM.sales + ' sales, ' + PM.at_least_10000 + ' reached $10,000 and ' + (PM.at_least_20000 || 'none') +
      ' reached $20,000. The best was ' + money(PM.top) + '. The cost of raising the foal is not included.'}));
  }
  if (F && state.goal === 'win'){
    items.push(h('li', null, 'The top-three chance comes from ' + F.foals + ' weanlings and yearlings shown at the futurity in ' + F.years[0] + ' to ' + F.years[F.years.length - 1] +
      ', each with its sire, dam and finishing place. We trained ' + F.rounds + ' versions and tried ' + F.combinations + ' combinations of factors. Tested on ' + F.split.year +
      ' foals it had not seen: of the third it rated highest, ' + pct(F.split.top_third_rate) + ' made a top three. Of the third it rated lowest, ' + pct(F.split.bottom_third_rate) + '.', foalCard()));
    if (F.worth) items.push(h('li', {text: 'What a finish is worth: of the futurity class winners, ' + pct(F.worth['won an open class'].top50_share) +
      ' were among that year\u2019s top 50 money earners, and those won a typical ' + money(F.worth['won an open class'].typical) + '. Of the foals outside the top three, ' +
      pct(F.worth['shown, outside the top three'].top50_share) + ' were.'}));
    items.push(h('li', {text: 'It only covers foals that were shown. We cannot see the foals that never reached the ring, so this is not the chance for every foal born.'}));
  }
  if (R){
    var rows = R.by_budget, row = rows[0];
    rows.forEach(function(x){ if (x.budget === null ? budget >= 2500 : budget >= x.budget) row = x; });
    items.push(h('li', {text: (state.goal === 'sell' ? 'The big results come as prize money. ' : '') + 'Tested on the ' + R.first_season + ' to ' + R.last_season + ' seasons' +
      (R.stallions ? ' and ' + R.stallions + ' stallions' : '') + ', ' + row.hit + ' of ' + row.picks +
      ' top picks by "chance of a prize winner" ' + (row.budget === null ? 'with no budget limit' : 'at a ' + money(row.budget) + ' budget') +
      ' went on to sire a foal in the year’s top 50 halter money earners. For the average stallion at that price it was ' + Math.round(row.base * 100) + '%.'}));
  }
  (M.notes || []).forEach(function(t){ items.push(h('li', {text: t})); });
  return items.length ? h('div', {class: 'card', style: 'margin-top:26px'}, h('p', {class: 'eyebrow', text: 'How sure is this?'}), h('ul', {class: 'plain'}, items)) : null;
}
function noEstimate(list){
  if (!list.length || !PM) return null;
  return h('details', null, h('summary', {text: list.length + ' more in your budget with no sale estimate'}),
    h('p', {class: 'fine', text: 'The public sales only include young horses by stallions standing for ' + money(PM.fee_range[0]) + ' to ' + money(PM.fee_range[1]) +
      '. Outside that range there is nothing to estimate a sale price from.'}),
    h('ul', {class: 'plain'}, list.map(function(s){ return h('li', null, s.name + ', ' + money(s.price.fee) + ' ', badge(s)); })));
}
function noPrice(){
  var list = S.filter(function(s){ return !s.price && s.rec.tier !== 'none'; }).sort(function(a, b){ return b.score - a.score; }).slice(0, 10);
  if (!list.length) return null;
  return h('details', null, h('summary', {text: list.length + ' with a record but no public price'}),
    h('p', {class: 'fine', text: 'We found no advertised fee or auction price for these, so they are not ranked by budget. Ask the farm.'}),
    h('ul', {class: 'plain'}, list.map(function(s){ return h('li', null, s.name + (s.stat ? ', ' + s.stat : '') + ' ', badge(s)); })));
}
function mareFacts(){
  var f = M.mare_facts;
  if (!f || !f.already_producers || !f.already_producers.n) return '';
  var a = f.already_producers, l = f.became_producers;
  return ' What such mares cost: in ' + f.mares_sold + ' public mare sales the typical price was ' + money(f.typical) + '. The ' + a.n + ' that were already listed producers sold for ' +
    money(a.low) + ' to ' + money(a.high) + (l && l.n ? ', and the ' + l.n + ' that later produced an earner had sold for ' + money(l.low) + ' to ' + money(l.high) : '') + '. Small numbers, so take them as a rough guide.';
}
function sameForLess(top, pool){
  if (!top.odds || !M.foal) return null;
  var same = pool.filter(function(s){ return s.odds && Math.abs(chance(s) - chance(top)) < 0.005 && s.price.fee <= top.price.fee - 250; })
    .sort(function(a, b){ return a.price.fee - b.price.fee || b.score - a.score; })[0];
  if (!same) return null;
  var r = M.foal.rank_split;
  return h('div', {class: 'note'}, h('b', {text: 'The same chance per foal for less. '}),
    same.name + ' at ' + money(same.price.fee) + ' is also one of the top 20 sires, so his foal gets the same ' + pct(chance(same)) + ' and you keep ' + money(top.price.fee - same.price.fee) + '. ' +
    (r ? 'Among foals that were shown, those by sires ranked 11 to 20 made a top three as often as those by the top 10 (' + pct(r.next10) + ' and ' + pct(r.top10) + '). ' : '') +
    'What the dearer stallion has is more foals winning in total, partly because more and better mares go to him.');
}
function useButton(v){ return h('button', {class: 'linkbtn', type: 'button', text: 'Use ' + money(v), onclick: function(){ state[state.have === 'mare' ? 'budget' : 'total'] = v; render(); }}); }

/* ---------- a mare ---------- */
function mareFlow(){
  return [h('h2', {text: 'What can you spend on the breeding?'}),
    moneyInput('budget', state.budget, function(n, typing){ state.budget = n; results(typing); }, 'Your budget for the stud fee, in dollars'),
    chips(M.fee_chips, state.budget, function(v){ state.budget = v; render(); }),
    h('div', {class: 'field'}, h('label', {for: 'sire', text: 'Who is her sire? (optional)'}),
      h('input', {id: 'sire', type: 'text', list: 'sires', value: state.sire, placeholder: 'Her sire’s name', autocomplete: 'off',
        oninput: function(e){ state.sire = e.target.value; results(true); }}),
      h('datalist', {id: 'sires'}, sireNames().map(function(n){ return h('option', {value: n}); })),
      h('small', {text: 'So we can leave out her close relatives.'})),
    h('div', {id: 'results'})];
}
function sireNames(){
  var seen = {};
  S.forEach(function(s){ [s.name, s.sire, s.dam_sire].forEach(function(n){ if (n) seen[n.toUpperCase()] = 1; }); });
  return Object.keys(seen).sort();
}
function mareResults(){
  var b = state.budget, out = [];
  if (!b) return [h('p', {class: 'fine', text: 'Enter a budget to see every option, ranked.'})];
  var ms = norm(state.sire), related = [];
  var fit = PRICED.filter(function(s){
    if (s.price.fee > b) return false;
    if (ms && (norm(s.name) === ms || norm(s.sire) === ms)) { related.push(s.name); return false; }
    return true;
  });
  if (!fit.length)
    return [h('div', {class: 'note'}, h('b', {text: 'Nothing fits ' + money(b) + '. '}), 'The lowest stud fee we have is ' + money(LOWEST) + '. ', useButton(LOWEST))];
  out.push(goalToggle());
  var star = byWinner(fit)[0];
  if (state.goal === 'sell'){
    var ranked = byReturn(fit);
    if (!ranked.length)
      out.push(h('div', {class: 'note'}, h('b', {text: 'We cannot estimate a sale price at ' + money(b) + '. '}),
        'The public sales only include young horses by stallions standing for ' + money(PM.fee_range[0]) + ' or more. ', useButton(PM.fee_range[0])));
    else {
      out.push(h('h2', {text: 'Your best return'}));
      out.push(returnCard(ranked[0], ranked, fit));
      out.push(h('h2', {text: ranked.length === 1 ? 'The one option we can price' : 'All ' + ranked.length + ' options, ranked by return'}));
      out.push(rankTable(ranked, [COL.fee, COL.sale, COL.ret], star.id));
    }
    out.push(noEstimate(unpriced(fit)));
  } else {
    var w = byWinner(fit);
    out.push(provenToggle());
    out.push(h('h2', {text: M.win_heading || 'Your best chance of a prize winner'}));
    out.push(winnerCard(w[0], null, null, w));
    out.push(sameForLess(w[0], w));
    out.push(h('h2', {text: w.length === 1 ? 'The one option in your budget' : 'All ' + w.length + ' options, ranked by foal record'}));
    out.push(rankTable(w, [[M.fee_label || 'Stud fee', COL.fee[1]], statCol(), PM ? COL.ret : null]));
    if (!PM) out.push(noPrice());
  }
  if (related.length) out.push(h('p', {class: 'fine', text: 'Left out as close relatives of your mare: ' + related.join(', ') + '.'}));
  out.push(expectBox(b));
  return out;
}

/* ---------- no horse yet ---------- */
function noneFlow(){
  return [h('h2', {text: 'What is your total budget?'}),
    moneyInput('total', state.total, function(n, typing){ state.total = n; results(typing); }, 'Your total budget for the breeding and the mare, in dollars'),
    chips(M.total_chips, state.total, function(v){ state.total = v; render(); }),
    h('div', {id: 'results'})];
}
function split(st, total){
  var left = total - st.price.fee;
  return h('div', {class: 'nums two'}, num('For the breeding', money(st.price.fee)),
    num('Left for the mare', money(left), MARES ? (left >= MARES.q1 ? 'most mares sold for ' + money(MARES.q1) + ' to ' + money(MARES.q3) : 'most mares sold for ' + money(MARES.q1) + ' or more') : null));
}
function noneResults(){
  var t = state.total;
  if (!t) return [h('p', {class: 'fine', text: 'Enter a budget to see every way to split it, ranked.'})];
  var fit = PRICED.filter(function(s){ return s.price.fee < t; });
  var sell = state.goal === 'sell', ranked = sell ? byReturn(fit) : byWinner(fit);
  if (!ranked.length)
    return [h('div', {class: 'note'}, h('b', {text: 'That will not cover a breeding yet. '}),
      'The lowest stud fee we can ' + (sell && PM ? 'price is ' + money(PM.fee_range[0]) : 'find is ' + money(LOWEST)) + ', before the cost of a mare.')];
  var top = ranked[0], star = byWinner(fit)[0], out = [goalToggle()];
  out.push(h('h2', {text: sell ? 'Your best return' : (M.win_heading || 'Your best chance of a prize winner')}));
  out.push(sell ? returnCard(top, ranked, fit, split(top, t)) : winnerCard(top, null, split(top, t), ranked));
  if (!sell) out.push(sameForLess(top, ranked));
  out.push(h('h2', {text: 'All ' + ranked.length + ' ways to split ' + money(t) + ', ranked'}));
  out.push(rankTable(ranked, [['Breeding', COL.fee[1]], ['Left for the mare', function(s){ return money(t - s.price.fee); }, 'wide'],
    sell ? ['Yearling sells for', COL.sale[1]] : statCol(), PM ? ['Return', COL.ret[1]] : null], sell ? star.id : null));
  if (sell) out.push(noEstimate(unpriced(fit)));
  if (sell) out.push(h('p', {class: 'fine', text: 'The return compares the yearling’s likely price with the stud fee. The mare is still yours to breed again or sell' +
    (MARES ? ': at public online sales most halter mares sold for ' + money(MARES.q1) + ' to ' + money(MARES.q3) + ' (' + MARES.n + ' sales).' : '.') +
    ' A better mare should give a better foal, but the public sales do not show by how much, so the foal’s price here does not change with what you spend on her.'}));
  else if (M.foal) out.push(h('p', {class: 'fine', text: 'Spend what is left on the mare with care: a mare that has already produced an earner lifts the top-three chance from ' +
    pct(top.odds.no) + ' to ' + pct(top.odds.yes) + ' with this stallion. That is as big a step as moving from an ordinary stallion to a leading one.' + mareFacts()}));
  out.push(expectBox(t));
  return out;
}

/* ---------- a stallion ---------- */
function stallionFlow(){
  var names = S.slice().sort(function(a, b){ return a.name < b.name ? -1 : 1; });
  var sel = h('select', {id: 'mine', onchange: function(e){ state.mine = e.target.value; results(); }},
    h('option', {value: '', text: 'Choose a stallion'}), names.map(function(s){ return h('option', {value: s.id, selected: s.id === state.mine, text: s.name}); }));
  return [h('div', {class: 'note'}, h('b', {text: 'We cannot match mares yet. '}),
      MARES ? 'We know what halter mares have sold for (most between ' + money(MARES.q1) + ' and ' + money(MARES.q3) + '), but not which mares are for sale.' : 'So far the data covers stallions only.',
      M.foal ? ' What to look for: a mare that has already produced an earner. Her foals finished in the top three ' + pct(M.foal.proven_rate) + ' of the time, against ' + pct(M.foal.other_rate) + ' for other mares.' : ''),
    h('div', {class: 'field'}, h('label', {for: 'mine', text: 'See how your stallion compares'}), sel,
      h('small', {text: 'If he is one of the ' + S.length + ' stallions we track.'})),
    h('div', {id: 'results'})];
}
function stallionResults(){
  var st = S.filter(function(s){ return s.id === state.mine; })[0];
  if (!st) return [];
  if (!st.price) return [h('div', {class: 'note'}, h('b', {text: st.name + ' has no published price. '}), st.rec.text)];
  var out = [winnerCard(st, 'Your stallion')];
  var peers = PRICED.filter(function(s){ return s.rec.tier === st.rec.tier && s.id !== st.id; }).map(function(s){ return s.price.fee; });
  if (peers.length){
    var lo = Math.min.apply(null, peers), hi = Math.max.apply(null, peers);
    var label = st.rec.tier === 'strong' ? 'a strong record' : st.rec.tier === 'some' ? 'some record' : 'no foal results yet';
    out.push(h('p', {class: 'why', text: 'The ' + peers.length + ' other stallions with ' + label + ' charge ' + (lo === hi ? money(lo) : money(lo) + ' to ' + money(hi)) + '.'}));
  }
  return out;
}

/* ---------- render ---------- */
var FLOWS = {mare: [mareFlow, mareResults], stallion: [stallionFlow, stallionResults], none: [noneFlow, noneResults]};
function results(typing){
  var box = document.getElementById('results');
  if (!box) return;
  box.replaceChildren();
  add(box, FLOWS[state.have][1]());
  if (typing) document.querySelectorAll('.chip').forEach(function(c){
    var v = state.have === 'mare' ? state.budget : state.total;
    c.setAttribute('aria-pressed', c.textContent === (v == null ? '' : money(v)) ? 'true' : 'false');
  });
}
function choices(label, opts, current, onpick, top){
  return [h('h2', {text: label, style: top ? 'margin-top:0' : null}),
    h('div', {class: 'choices', role: 'group', 'aria-label': label}, opts.map(function(o){
      return h('button', {type: 'button', class: 'choice', 'aria-pressed': current === o[0] ? 'true' : 'false', onclick: function(){ onpick(o[0]); }}, h('b', {text: o[1]}), h('span', {text: o[2]}));
    }))];
}
function render(){
  app.replaceChildren();
  if (KEYS.length > 1) add(app, choices('Which breed?', KEYS.map(function(k){ return [k, B[k].label, B[k].sub]; }), state.breed,
    function(k){ use(k); state.budget = null; state.total = null; render(); }, true));
  if (state.breed){
    if (M.intro) add(app, h('div', {class: 'note'}, M.intro));
    add(app, choices('What do you have?', [['mare', 'A mare', 'Find a stallion for her'], ['stallion', 'A stallion', 'Find a mare for him'], ['none', 'No horse yet', 'Plan the stallion and the mare']],
      state.have, function(k){ state.have = k; state.all = false; state.proven = false; render(); }, KEYS.length < 2));
    if (state.have){ add(app, FLOWS[state.have][0]()); results(); }
  }
  foot();
}
function foot(){
  var f = document.getElementById('foot');
  f.replaceChildren();
  var how = state.breed ? (M.how || []) : ['Choose a breed to see how its ranking works and what data is behind it.'];
  add(f, [h('details', null, h('summary', {text: 'How this works'}), h('ul', null, how.map(function(t){ return h('li', {text: t}); }))),
    h('p', null, h('a', {href: 'explore.html', text: 'See all the Quarter Horse data'}), D.repo ? ' · ' : null, D.repo ? h('a', {href: D.repo, text: 'Source'}) : null,
      ' · Updated ' + D.generated)]);
}
if (KEYS.length === 1) use(KEYS[0]);
render();
})();
</script>
</body>
</html>
